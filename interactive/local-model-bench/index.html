<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local Model Bench — Uso de Modelos Locales</title>
<meta name="description" content="Banco de trabajo interactivo para decidir qué modelo local usar, con qué hardware, para qué tarea." />
<style>
:root {
  --bg: #0e0e10;
  --bg-raised: #16161a;
  --bg-sunken: #0a0a0c;
  --panel: #1b1b20;
  --fg: #f5f5f7;
  --fg-muted: #8a8a90;
  --fg-dim: #aeaeb4;
  --accent: #ffce4d;
  --accent-soft: rgba(255, 206, 77, 0.14);
  --accent-line: rgba(255, 206, 77, 0.32);
  --info: #7adfff;
  --info-soft: rgba(122, 223, 255, 0.14);
  --line: rgba(255, 255, 255, 0.12);
  --line-soft: rgba(255, 255, 255, 0.07);
  --ok: #7bd88f;
  --warn: #ffce4d;
  --bad: #ff8a80;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-base: 16px;
  --fs-md: 18px;
  --fs-lg: 22px;
  --fs-xl: 28px;
  --fs-xxl: 36px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  --radius: 8px;
  --radius-sm: 5px;
  --rail-w: 260px;
  --content-max: 860px;
}
</style>
<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: var(--fs-base);
  line-height: 1.55;
  text-wrap: pretty;
}

h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 var(--sp-3); font-weight: 650; }
h1 { font-size: var(--fs-xl); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: var(--fs-md); }
h4 { font-size: var(--fs-base); }
p { margin: 0 0 var(--sp-3); }
ul, ol { margin: 0 0 var(--sp-3); padding-left: 1.25em; }
li { margin-bottom: var(--sp-1); }

a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }
a:hover { color: #fff; border-bottom-color: #fff; }

code, kbd, samp, pre { font-family: var(--font-mono); font-size: 0.92em; }
code { background: var(--bg-sunken); padding: 1px 5px; border-radius: 4px; }
pre {
  background: var(--bg-sunken);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: var(--sp-3);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--accent); color: #101014; padding: var(--sp-2) var(--sp-3); border: 0;
}
.skip-link:focus { left: var(--sp-3); top: var(--sp-3); }

.noscript { padding: var(--sp-5); max-width: 42em; }

.muted { color: var(--fg-muted); }
.small { font-size: var(--fs-sm); }
.mono { font-family: var(--font-mono); }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  clip-path: inset(50%); overflow: hidden; white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
<style>
.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100vh;
  align-items: start;
}

.rail {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  overflow-y: auto;
  background: var(--bg-raised);
  border-right: 1px solid var(--line-soft);
  padding: var(--sp-4) 0 var(--sp-6);
}

.rail-brand {
  display: block;
  padding: 0 var(--sp-4) var(--sp-3);
  font-size: var(--fs-sm);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-muted);
  border: 0;
}
.rail-brand:hover { color: var(--fg); border: 0; }

.profile-context {
  margin: 0 var(--sp-3) var(--sp-4);
  padding: var(--sp-3);
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
}
.profile-context .pc-label {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-muted);
}
.profile-context .pc-name { font-weight: 650; margin-top: 2px; word-break: break-word; }
.profile-context .pc-kind {
  display: inline-block; margin-top: var(--sp-2);
  font-size: var(--fs-xs); padding: 2px 7px; border-radius: 4px;
  background: var(--info-soft); color: var(--info);
}
.profile-context .pc-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }

.rail-group-title {
  padding: var(--sp-3) var(--sp-4) var(--sp-1);
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-muted);
}

.rail-nav { display: flex; flex-direction: column; }
.rail-link {
  display: grid;
  grid-template-columns: 1.6em 1.6em minmax(0, 1fr);
  align-items: baseline;
  gap: var(--sp-1);
  padding: var(--sp-2) var(--sp-4);
  font-size: var(--fs-sm);
  color: var(--fg-dim);
  border: 0;
  border-left: 3px solid transparent;
}
.rail-link:hover { background: rgba(255,255,255,0.05); color: var(--fg); border-bottom: 0; }
.rail-link[aria-current="page"] {
  border-left-color: var(--accent);
  background: var(--accent-soft);
  color: var(--fg);
  font-weight: 600;
}
.rail-link .rl-num { color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.rail-link .rl-state { text-align: center; }
.rail-link .rl-state.done { color: var(--ok); }
.rail-link .rl-state.todo { color: var(--fg-muted); }

.rail-meta {
  padding: var(--sp-4) var(--sp-4) 0;
  font-size: var(--fs-xs);
  color: var(--fg-muted);
}

.main { padding: var(--sp-6) var(--sp-6) var(--sp-7); min-width: 0; }
.main-inner { max-width: var(--content-max); }

.section-head { margin-bottom: var(--sp-5); }
.section-head .eyebrow {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-muted);
  margin-bottom: var(--sp-2);
}
.section-head .lede { color: var(--fg-dim); max-width: 62ch; }

.section-foot {
  display: flex; flex-wrap: wrap; gap: var(--sp-3);
  margin-top: var(--sp-6); padding-top: var(--sp-4);
  border-top: 1px solid var(--line-soft);
}

.route-strip { display: none; }

.landing { max-width: 720px; margin: 0 auto; padding: var(--sp-7) var(--sp-5); }
.landing h1 { font-size: var(--fs-xxl); }
.landing .entries { display: flex; flex-direction: column; gap: var(--sp-3); margin: var(--sp-6) 0 var(--sp-5); }
.landing .entry {
  display: block; width: 100%; text-align: left;
  padding: var(--sp-4);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
}
.landing .entry:hover { border-color: var(--accent-line); background: #20202a; }
.landing .entry .e-title { display: block; font-size: var(--fs-md); font-weight: 650; }
.landing .entry .e-desc { display: block; margin-top: 2px; color: var(--fg-muted); font-size: var(--fs-sm); }

.explore-banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3);
  margin-bottom: var(--sp-5); padding: var(--sp-3) var(--sp-4);
  background: var(--info-soft);
  border: 1px solid rgba(122,223,255,0.3);
  border-radius: var(--radius);
  font-size: var(--fs-sm);
}
.explore-banner strong { color: var(--info); }

/* Macro-station headings: orientation colour per phase of the route. */
.rail-group-title.station { font-weight: 600; letter-spacing: 0.08em; }
.rail-group-title.station-accent { color: var(--accent); }
.rail-group-title.station-info   { color: var(--info); }
.rail-group-title.station-ok     { color: var(--ok); }
.rail-group-title.station-warn   { color: var(--warn); }
.rail-group-title.station-bad    { color: var(--bad); }
.rail-group-title.station-muted  { color: var(--fg-dim); }
</style>
<style>
.btn {
  background: rgba(255,255,255,0.08);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  font-size: var(--fs-sm);
  cursor: pointer;
  min-height: 34px;
}
.btn:hover { background: rgba(255,255,255,0.16); }
.btn.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
.btn.accent:hover { background: rgba(255,206,77,0.26); }
.btn.danger { color: var(--bad); border-color: rgba(255,138,128,0.35); }
.btn.quiet { background: transparent; }
.btn[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }

.card {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: var(--sp-4);
  margin-bottom: var(--sp-4);
}
.card > :last-child { margin-bottom: 0; }
.card-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.card-title h3, .card-title h4 { margin: 0; }

.grid { display: grid; gap: var(--sp-4); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }

.field { display: flex; flex-direction: column; gap: var(--sp-1); margin-bottom: var(--sp-3); }
.field > label { font-size: var(--fs-sm); font-weight: 600; }
.field .hint { font-size: var(--fs-xs); color: var(--fg-muted); }
.field input[type="text"], .field input[type="number"], .field select, .field textarea {
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  min-height: 38px;
  width: 100%;
  max-width: 32rem;
}
.field textarea { min-height: 9rem; resize: vertical; font-family: var(--font-mono); font-size: var(--fs-sm); }

.choices { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.choice {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: 7px 12px; min-height: 40px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.choice:hover { background: rgba(255,255,255,0.1); }
.choice[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.fit {
  display: flex; align-items: baseline; gap: var(--sp-2);
  font-size: var(--fs-sm);
  padding: 3px 0;
}
.fit .fit-icon { font-family: var(--font-mono); width: 1.1em; text-align: center; }
.fit .fit-label { color: var(--fg-muted); }
.fit .fit-value { font-weight: 650; }
.fit.is-good .fit-icon, .fit.is-good .fit-value { color: var(--ok); }
.fit.is-mid .fit-icon, .fit.is-mid .fit-value { color: var(--warn); }
.fit.is-bad .fit-icon, .fit.is-bad .fit-value { color: var(--bad); }
.fit.is-unknown .fit-icon, .fit.is-unknown .fit-value { color: var(--fg-muted); }

.fit-reasons { margin: var(--sp-2) 0 0; padding-left: 1.1em; font-size: var(--fs-sm); color: var(--fg-dim); }

.badge {
  display: inline-block;
  font-size: var(--fs-xs);
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--line-soft);
  color: var(--fg-muted);
  white-space: nowrap;
}
.badge.pending { color: var(--warn); border-color: var(--accent-line); }

details {
  border-top: 1px solid var(--line-soft);
  margin-top: var(--sp-3);
  padding-top: var(--sp-2);
}
details > summary {
  cursor: pointer;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--fg-dim);
  list-style-position: outside;
}
details > summary:hover { color: var(--fg); }
details[open] > summary { margin-bottom: var(--sp-2); }
details .details-body { font-size: var(--fs-sm); color: var(--fg-dim); }

.notice {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-4);
  font-size: var(--fs-sm);
}
.notice.warn { border-color: var(--accent-line); background: var(--accent-soft); }
.notice.bad { border-color: rgba(255,138,128,0.35); background: rgba(255,138,128,0.1); }
.notice.info { border-color: rgba(122,223,255,0.3); background: var(--info-soft); }
.notice > :last-child { margin-bottom: 0; }

dialog {
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--sp-5);
  max-width: 30rem;
  width: calc(100% - 2rem);
}
dialog::backdrop { background: rgba(0,0,0,0.65); }
dialog h3 { margin-top: 0; }
dialog .dialog-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-4); }

.kv { display: grid; grid-template-columns: minmax(8rem, 14rem) minmax(0, 1fr); gap: var(--sp-1) var(--sp-3); font-size: var(--fs-sm); }
.kv dt { color: var(--fg-muted); }
.kv dd { margin: 0; }

.table-scroll { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.data th, table.data td { text-align: left; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.data th { color: var(--fg-muted); font-weight: 600; }

.imgslot {
  display: block; width: 100%; border: 1px dashed var(--line);
  border-radius: var(--radius); padding: var(--sp-5) var(--sp-3);
  text-align: center; font-family: var(--font-mono); font-size: var(--fs-xs);
  color: var(--fg-muted);
  background: repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 8px, transparent 8px 16px);
}

/* Candidate/model details read better stacked in a narrow column: label above value. */
.dc-stack.kv { display: block; }
.dc-stack.kv dt { color: var(--fg-muted); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.04em; }
.dc-stack.kv dd { margin: 0 0 var(--sp-3); }
.canonical-link { display: inline-block; margin-top: var(--sp-2); }

/* Chips: the observable dimensions of the benchmark, read at a glance. */
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.chip { font-size: var(--fs-xs); padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg-dim); }
</style>
<style>
.candidate-card { display: flex; flex-direction: column; }
.candidate-card .cc-model { font-size: var(--fs-md); font-weight: 650; }
.candidate-card .cc-meta { font-size: var(--fs-sm); color: var(--fg-muted); margin-bottom: var(--sp-3); }
.candidate-card .cc-fits { margin-bottom: var(--sp-3); }
.candidate-card .cc-tradeoff { font-size: var(--fs-sm); color: var(--fg-dim); margin-bottom: var(--sp-3); }
.candidate-card .cc-select { margin-top: auto; }
.candidate-card.is-selected { border-color: var(--accent-line); box-shadow: inset 0 0 0 1px var(--accent-line); }

.model-lens .kv { margin-bottom: var(--sp-3); }

.plan-section { margin-bottom: var(--sp-5); }
.plan-section h3 { margin-bottom: var(--sp-2); }
.plan-missing { color: var(--fg-muted); font-style: normal; }

.pressure {
  display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: var(--sp-3);
  padding: var(--sp-2) 0; border-bottom: 1px solid var(--line-soft);
  font-size: var(--fs-sm);
}
.pressure:last-child { border-bottom: 0; }
.pressure .p-toward { font-weight: 650; text-transform: uppercase; font-size: var(--fs-xs); letter-spacing: 0.06em; }
.pressure.toward-local .p-toward { color: var(--ok); }
.pressure.toward-cloud .p-toward { color: var(--info); }
.pressure.toward-hybrid .p-toward { color: var(--accent); }
.pressure.toward-neutral .p-toward { color: var(--fg-muted); }
.pressure.strength-strong .p-label { font-weight: 650; }
.pressure .p-reason { color: var(--fg-muted); }

.route-choice { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-4); }
.route-choice .btn { min-width: 8rem; justify-content: center; }

.run-list { display: flex; flex-direction: column; gap: var(--sp-3); }
.run-record { border: 1px solid var(--line-soft); border-radius: var(--radius); padding: var(--sp-3); }
.run-record .rr-head { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: baseline; margin-bottom: var(--sp-2); }
.run-record .rr-num { font-weight: 650; }
.eval-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }

.step-list { counter-reset: step; list-style: none; padding: 0; }
.step-list > li {
  counter-increment: step;
  position: relative;
  padding-left: 2.2rem;
  margin-bottom: var(--sp-3);
}
.step-list > li::before {
  content: counter(step);
  position: absolute; left: 0; top: 0;
  width: 1.6rem; height: 1.6rem;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-size: var(--fs-xs); font-weight: 700;
}

.profile-list { display: flex; flex-direction: column; gap: var(--sp-3); }
.profile-row {
  display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; justify-content: space-between;
  border: 1px solid var(--line-soft); border-radius: var(--radius); padding: var(--sp-3);
}
.profile-row.is-active { border-color: var(--accent-line); }
.profile-row .pr-name { font-weight: 650; }
.profile-row .pr-meta { font-size: var(--fs-xs); color: var(--fg-muted); }

/* 07 · model vs tooling read as two lanes, not one undifferentiated pair. */
.route-lane { border-left: 3px solid var(--line); }
.route-lane.lane-model { border-left-color: var(--ok); }
.route-lane.lane-tooling { border-left-color: var(--info); }
.route-lane .lane-tag { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); margin-bottom: var(--sp-1); }
.lane-model .lane-tag { color: var(--ok); }
.lane-tooling .lane-tag { color: var(--info); }

/* 12 · cause and action carry semantic colour instead of flat labels. */
.ts-kv dt.ts-cause { color: var(--bad); }
.ts-kv dt.ts-action { color: var(--ok); }

/* 11 · real faro-v1 outputs compared side by side. */
.demo-out pre { max-height: 16rem; overflow: auto; font-size: var(--fs-xs); }
.demo-out .chips { margin-bottom: var(--sp-3); }
.demo-out .chip.is-good { color: var(--ok); border-color: rgba(123, 216, 143, 0.4); }
.demo-out .chip.is-mid { color: var(--warn); border-color: rgba(255, 206, 77, 0.4); }
.demo-out .chip.is-bad { color: var(--bad); border-color: rgba(255, 138, 128, 0.4); }
.demo-out-clean { border-color: var(--ok); }

/* 14 · thematic blocks need more air between them than inside them. */
.plan-section { margin-bottom: var(--sp-7); }
.plan-section > h3 { padding-bottom: var(--sp-2); border-bottom: 1px solid var(--line-soft); }
</style>
<style>
@media (max-width: 1100px) {
  :root { --rail-w: 220px; }
  .main { padding: var(--sp-5) var(--sp-5) var(--sp-7); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }

  .rail {
    position: static;
    height: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line-soft);
    padding: var(--sp-3) 0;
  }
  .rail-nav {
    flex-direction: row;
    overflow-x: auto;
    gap: var(--sp-1);
    padding: 0 var(--sp-3) var(--sp-2);
    scrollbar-width: thin;
  }
  .rail-link {
    grid-template-columns: auto auto;
    white-space: nowrap;
    border-left: 0;
    border-bottom: 3px solid transparent;
    border-radius: var(--radius-sm);
    min-height: 44px;
    align-items: center;
  }
  .rail-link[aria-current="page"] { border-left: 0; border-bottom-color: var(--accent); }

-troubleshooting-v1"]},{"id":"runner-ui-mismatch","symptom":"La opción que menciona el workshop no aparece donde se indica.","likelyCause":"El runner cambió su interfaz en una versión posterior a la verificación de estos datos.","nextAction":"Buscar la opción por nombre en la configuración del modelo y anotar la versión del runner en la Run Card.","sourceIds":["workshop-troubleshooting-v1"]},{"id":"mobile-limits","symptom":"En el teléfono el modelo arranca pero se corta o el equipo se calienta.","likelyCause":"Memoria compartida con el sistema, límites térmicos y de batería.","nextAction":"Usar el teléfono para seguir y demostrar, y mover la prueba real a la laptop.","sourceIds":["workshop-troubleshooting-v1"]}],"reference":{"readModel":{"featuredModelIds":["llama-3-8b-instruct"],"lens":[{"id":"family","label":"Familia y versión","body":"El nombre indica linaje y generación. «3.2» y «3.1» no son la misma cosa aunque digan Llama."},{"id":"publisher","label":"Publisher","body":"Quién publicó los pesos. Determina la licencia y qué afirmaciones son del publisher y no medidas independientes."},{"id":"parameters","label":"Parámetros","body":"Tamaño del modelo. Predice consumo de memoria mucho mejor que calidad."},{"id":"format","label":"Formato","body":"GGUF es el formato de archivo que usan los runners locales de este workshop."},{"id":"quantization","label":"Cuantización","body":"Reduce la precisión de los pesos para bajar tamaño y memoria. Q4_K_M es el punto medio habitual."},{"id":"context","label":"Contexto","body":"Cuánto texto puede considerar a la vez. El máximo declarado no es el valor que conviene usar."},{"id":"language","label":"Idioma","body":"Qué idiomas declara soportar. Relevante si el trabajo real es en español."},{"id":"intended","label":"Uso previsto","body":"Para qué dice servir. Un modelo de código fuera de código es otra herramienta."},{"id":"hardware","label":"Implicación de hardware","body":"Archivo + contexto + runner. Ahí se decide si corre cómodo o al borde."}]},"sections":[{"id":"ref-hardware","title":"Hardware","body":"El Bench arma un sobre de capacidad con RAM, tipo de gráficos, memoria de video o unificada y almacenamiento libre. Es un sobre, no una garantía: el sistema operativo, el navegador y el runner también consumen memoria."},{"id":"ref-quantization","title":"Cuantización","body":"Menos precisión por peso significa menos memoria y menos calidad. El Bench recomienda la variante que deja holgura, no la más grande que entra."},{"id":"ref-context","title":"Contexto","body":"El contexto se reserva en memoria. Un modelo que soporta un contexto grande no vuelve gratuito ni sensato usarlo completo."},{"id":"ref-runners","title":"Runners","body":"El runner es el programa que carga el modelo. Adjuntar documentos, buscar en la web o recordar entre sesiones son capacidades del runner, no del modelo."},{"id":"ref-routing","title":"Local / Cloud / Hybrid","body":"La decisión la toma la persona. El Bench muestra las presiones: privacidad, necesidad de información actual, ajuste de hardware, ajuste de tarea, contexto, rendimiento observado y costo del error."}],"glossary":[{"term":"GGUF","es":"Formato de archivo de modelo que usan los runners locales de este workshop."},{"term":"Cuantización / quantization","es":"Reducir la precisión de los pesos para bajar tamaño y memoria."},{"term":"Q4_K_M","es":"Variante de cuantización de 4 bits de uso habitual como punto medio."},{"term":"Contexto / context","es":"Cantidad de texto que el modelo considera a la vez, medida en tokens."},{"term":"Runner","es":"Programa que carga y ejecuta el modelo (GPT4All, LM Studio, Jan, PocketPal)."},{"term":"VRAM","es":"Memoria de la placa de video."},{"term":"Memoria unificada","es":"Memoria compartida entre CPU y GPU, típica de Apple Silicon."},{"term":"Hardware Fit","es":"Ajuste de hardware: si corre de forma segura y razonable en este equipo."},{"term":"Task Fit","es":"Ajuste de tarea: si es la herramienta adecuada para esta tarea <script type="application/json" id="lmb-modules">{"js/app.js":"import { loadDatasets } from \"lmb:js/data-loader.js\";\nimport { parseHash, ROUTES, nextRoute, prevRoute } from \"lmb:js/routes.js\";\nimport { createStore } from \"lmb:js/state/store.js\";\nimport { createSessionState } from \"lmb:js/state/session.js\";\nimport { createExploreState } from \"lmb:js/state/explore.js\";\nimport { getDemo, demoAsProfile, cloneDemoToUser } from \"lmb:js/state/demos.js\";\nimport { deriveProfile } from \"lmb:js/domain/derive.js\";\nimport { computeCompletion } from \"lmb:js/domain/completion.js\";\nimport { clear, el } from \"lmb:js/ui/dom.js\";\nimport { renderShell } from \"lmb:js/ui/shell.js\";\nimport { renderLanding } from \"lmb:js/ui/landing.js\";\nimport { renderProfiles, renderDemos } from \"lmb:js/ui/profiles.js\";\n\nimport * as useSection from \"lmb:js/ui/sections/use.js\";\nimport * as hardwareSection from \"lmb:js/ui/sections/hardware.js\";\nimport * as readModelSection from \"lmb:js/ui/sections/read-model.js\";\nimport * as candidatesSection from \"lmb:js/ui/sections/candidates.js\";\nimport * as selectModelSection from \"lmb:js/ui/sections/select-model.js\";\nimport * as quantContextSection from \"lmb:js/ui/sections/quant-context.js\";\nimport * as runnersSection from \"lmb:js/ui/sections/runners.js\";\nimport * as runnerSection from \"lmb:js/ui/sections/runner.js\";\nimport * as pocketpalSection from \"lmb:js/ui/sections/pocketpal.js\";\nimport * as buildTestSection from \"lmb:js/ui/sections/build-test.js\";\nimport * as evaluateSection from \"lmb:js/ui/sections/evaluate.js\";\nimport * as troubleshootingSection from \"lmb:js/ui/sections/troubleshooting.js\";\nimport * as routingSection from \"lmb:js/ui/sections/routing.js\";\nimport * as planSection from \"lmb:js/ui/sections/plan.js\";\nimport * as referenceView from \"lmb:js/ui/sections/reference.js\";\nimport * as sourcesView from \"lmb:js/ui/sections/sources.js\";\n\nconst SECTIONS = {\n  \"use\": useSection,\n  \"hardware\": hardwareSection,\n  \"read-model\": readModelSection,\n  \"candidates\": candidatesSection,\n  \"select-model\": selectModelSection,\n  \"quant-context\": quantContextSection,\n  \"runners\": runnersSection,\n  \"runner\": runnerSection,\n  \"pocketpal\": pocketpalSection,\n  \"build-test\": buildTestSection,\n  \"evaluate\": evaluateSection,\n  \"troubleshooting\": troubleshootingSection,\n  \"routing\": routingSection,\n  \"plan\": planSection\n};\n\nfunction newId() {\n  if (typeof crypto !== \"undefined\" && crypto.randomUUID) return crypto.randomUUID();\n  return \"id-\" + Math.random().toString(36).slice(2, 10);\n}\n\nexport async function bootApp(options = {}) {\n  const root = options.root || document.getElementById(\"app\");\n  let datasets;\n  try {\n    datasets = options.datasets || await loadDatasets();\n  } catch (err) {\n    clear(root);\n    root.appendChild(el(\"main\", { class: \"landing\" },\n      el(\"h1\", { text: \"No se pudieron cargar los datos locales\" }),\n      el(\"p\", { text: String(err.message || err) }),\n      el(\"p\", { class: \"small muted\", text: \"El Bench necesita servirse por HTTP (por ejemplo `python3 -m http.server`), no abrirse como archivo.\" })\n    ));\n    return null;\n  }\n\n  const storage = options.storage || window.localStorage;\n  const session = createSessionState();\n  const explore = createExploreState();\n  const store = createStore(storage, {\n    derive: (profile) => deriveProfile(profile, datasets),\n    taskOptions: datasets.taskOptions\n  });\n  store.refreshDerived((datasets.version && datasets.version.dataVersion) || null);\n\n  let viewingDemoId = null;\n\n  const app = {\n    datasets, store, session, explore, newId,\n\n    navigate(hash) {\n      if (location.hash === hash) render();\n      else location.hash = hash;\n    },\n\n    rerender: render,\n\n    startWorkshop() {\n      viewingDemoId = null;\n      explore.discard();\n      store.createProfile();\n      app.navigate(\"#/use\");\n    },\n\n    openDemo(id) {\n      viewingDemoId = id;\n      explore.discard();\n      app.navigate(\"#/use\");\n    },\n\n    cloneDemo(id) {\n      const demo = getDemo(id, datasets.demos);\n      if (!demo) return;\n      const profile = cloneDemoToUser(demo, { id: newId(), now: new Date().toISOString(), fallbackName: `${demo.name} (copia)` });\n      store.adoptProfile(profile);\n      viewingDemoId = null;\n      app.navigate(\"#/use\");\n    },\n\n    exitDemo() { viewingDemoId = null; },\n\n    beginExplore() {\n      const current = currentProfile();\n      if (!current) return;\n      explore.begin(current, viewingDemoId ? \"demo\" : \"user\");\n      explore.setDerived(deriveProfile(explore.profile, datasets));\n      render();\n    },\n\n    applyExplore(mode) {\n      const payload = explore.payload();\n      if (!payload) return;\n      if (mode === \"new\" || explore.originKind === \"demo\") {\n        store.createProfile(payload);\n        viewingDemoId = null;\n      } else {\n        store.updateProfile(explore.originProfileId, p => {\n          p.use = payload.use;\n          p.hardware = payload.hardware;\n          p.selection = payload.selection;\n          p.meta.seen = { ...p.meta.seen, ...payload.meta.seen };\n        });\n      }\n      explore.discard();\n      render();\n    },\n\n    /** Single mutation boundary: Explore sandbox → memory; demo → clone first; user → store. */\n    update(mutator) {\n      if (explore.isActive()) {\n        explore.update(mutator);\n        explore.setDerived(deriveProfile(explore.profile, datasets));\n        render();\n        return;\n      }\n      if (viewingDemoId) {\n        const demo = getDemo(viewingDemoId, datasets.demos);\n        const profile = cloneDemoToUser(demo, { id: newId(), now: new Date().toISOString(), fallbackName: `${demo.name} (copia)` });\n        store.adoptProfile(profile);\n        viewingDemoId = null;\n        store.updateProfile(profile.id, mutator);\n        render();\n        return;\n      }\n      let activeId = store.getActiveId();\n      if (!activeId) activeId = store.createProfile().id;\n      store.updateProfile(activeId, mutator);\n      render();\n    },\n\n    selectModel(modelId) {\n      app.update(p => {\n        p.selection.selectedModelId = modelId;\n        const model = (datasets.models || []).find(m => m.id === modelId);\n        const quants = model ? model.quantizations.map(q => q.id) : [];\n        if (p.selection.quantization && !quants.includes(p.selection.quantization)) p.selection.quantization = null;\n        if (model && Number(p.selection.contextTokens) > Number(model.maxContextTokens)) p.selection.contextTokens = null;\n      });\n    },\n\n    markSeen(key) {\n      if (explore.isActive()) {\n        explore.update(p => { p.meta.seen[key] = true; });\n        return;\n      }\n      if (viewingDemoId) return;\n      const activeId = store.getActiveId();\n      if (!activeId) return;\n      const profile = store.getProfile(activeId);\n      if (profile && profile.meta.seen[key]) return;\n      store.updateProfile(activeId, p => { p.meta.seen[key] = true; });\n    }\n  };\n\n  function currentProfile() {\n    if (explore.isActive()) return explore.profile;\n    if (viewingDemoId) {\n      const demo = getDemo(viewingDemoId, datasets.demos);\n      if (demo) {\n        const profile = demoAsProfile(demo);\n        profile.derived = deriveProfile(profile, datasets);\n        return profile;\n      }\n    }\n    return store.getActiveProfile();\n  }\n\n  function profileKind() {\n    if (explore.isActive()) return \"explore\";\n    if (viewingDemoId) return \"demo\";\n    return \"user\";\n  }\n\n  function render() {\n    const target = parseHash(location.hash);\n\n    if (target.kind === \"route\" && !explore.isActive() && !viewingDemoId && !store.getActiveId()) {\n      store.createProfile();\n    }\n\n    let profile = currentProfile();\n\n    const ctx = Object.assign(Object.create(app), {\n      route: target.kind === \"route\" ? target.id : null,\n      view: target.kind === \"view\" ? target.id : null,\n      profile,\n      profileKind: profileKind(),\n      derived: profile ? profile.derived : null,\n      completion: profile ? computeCompletion(profile) : {},\n      isReadOnlyDemo: Boolean(viewingDemoId)\n    });\n\n    let content;\n    if (target.kind === \"route\") {\n      content = SECTIONS[target.id].render(ctx);\n    } else if (target.id === \"landing\") {\n      clear(root);\n      root.appendChild(renderLanding(ctx));\n      return;\n    } else if (target.id === \"profiles\") {\n      content = renderProfiles(ctx);\n    } else if (target.id === \"demos\") {\n      content = renderDemos(ctx);\n    } else if (target.id === \"reference\") {\n      content = referenceView.render(ctx);\n    } else {\n      content = sourcesView.render(ctx);\n    }\n\n    // markSeen during render may have advanced completion: re-read before drawing the rail.\n    const refreshed = currentProfile();\n    if (refreshed) {\n      ctx.profile = refreshed;\n      ctx.derived = refreshed.derived;\n      ctx.completion = computeCompletion(refreshed);\n    }\n\n    clear(root);\n    root.appendChild(renderShell(ctx, content));\n    window.scrollTo(0, 0);\n  }\n\n  window.addEventListener(\"hashchange\", render);\n  window.addEventListener(\"keydown\", onKeydown);\n  render();\n\n  function onKeydown(event) {\n    if (event.metaKey || event.ctrlKey || event.altKey) return;\n    const t = event.target;\n    if (t && t.closest && t.closest(\"input, textarea, select, button, a, [contenteditable]\")) return;\n    const route = parseHash(location.hash);\n    if (route.kind !== \"route\") return;\n    if (event.key === \"ArrowRight\" || event.key === \"PageDown\") {\n      const next = nextRoute(route.id);\n      if (next) { event.preventDefault(); app.navigate(`#/${next}`); }\n    } else if (event.key === \"ArrowLeft\" || event.key === \"PageUp\") {\n      const prev = prevRoute(route.id);\n      if (prev) { event.preventDefault(); app.navigate(`#/${prev}`); }\n    }\n  }\n\n  if (options.expose !== false) {\n    window.__lmb = { app, datasets, store, session, explore, ROUTES, deriveProfile, computeCompletion };\n  }\n  return app;\n}\n\nif (typeof window !== \"undefined\" && !window.__LMB_NO_AUTOBOOT) {\n  bootApp();\n  // deployment build: no service worker on this surface.\n}\n","js/data-loader.js":"const FILES = Object.freeze({\n  version: \"data/data-version.json\",\n  models: \"data/models.json\",\n  hardwareRules: \"data/hardware-rules.json\",\n  taskOptions: \"data/task-options.json\",\n  demos: \"data/demo-profiles.json\",\n  benchmark: \"data/benchmark.json\",\n  benchmarkDemos: \"data/benchmark-demos.json\",\n  runners: \"data/runners.json\",\n  troubleshooting: \"data/troubleshooting.json\",\n  reference: \"data/reference.json\",\n  sources: \"data/sources.json\"\n});\n\n/** Resolves dataset URLs relative to this module, so the same build works at \"/\" and at \"/sub/path/\". */\nfunction urlFor(relative) {\n  return new URL(\"../\" + relative, import.meta.url).href;\n}\n\nexport async function loadDatasets() {\n  // deployment build: datasets are embedded in the page, not fetched.\n  if (!globalThis.__LMB_DATA) throw new Error('__LMB_DATA ausente en el bundle');\n  return Object.freeze({ ...globalThis.__LMB_DATA });\n\n}\n\nexport { FILES as DATASET_FILES };\n","js/routes.js":"export const ROUTES = Object.freeze([\n  \"use\", \"hardware\", \"read-model\", \"candidates\", \"select-model\",\n  \"quant-context\", \"runners\", \"runner\", \"pocketpal\", \"build-test\",\n  \"evaluate\", \"troubleshooting\", \"routing\", \"plan\"\n]);\n\nexport const ROUTE_META = Object.freeze({\n  \"use\":             { order: 1,  labelEs: \"Tarea\",            labelEn: \"Use\" },\n  \"hardware\":        { order: 2,  labelEs: \"Hardware\",         labelEn: \"Hardware\" },\n  \"read-model\":      { order: 3,  labelEs: \"Cómo leer un modelo \n\nexport function routeLabel(id) {\n  return ROUTE_META[id] ? ROUTE_META[id].labelEs : id;\n}\n\nexport function nextRoute(id) {\n  const i = ROUTES.indexOf(id);\n  return i >= 0 && i \u003c ROUTES.length - 1 ? ROUTES[i + 1] : null;\n}\n\nexport function prevRoute(id) {\n  const i = ROUTES.indexOf(id);\n  return i > 0 ? ROUTES[i - 1] : null;\n}\n","js/state/store.js":"import { createEmptyProfile, PROFILE_SCHEMA_VERSION } from \"lmb:js/state/schema.js\";\n\nexport const STORE_KEY = \"lmb.profiles.v1\";\n\nfunction defaultNow() { return new Date().toISOString(); }\n\nfunction defaultId() {\n  if (typeof crypto !== \"undefined\" && crypto.randomUUID) return crypto.randomUUID();\n  return \"p-\" + Math.random().toString(36).slice(2, 10);\n}\n\nfunction emptyEnvelope() {\n  return { schemaVersion: PROFILE_SCHEMA_VERSION, activeProfileId: null, profiles: [] };\n}\n\nfunction migrate(envelope) {\n  if (!envelope || typeof envelope !== \"object\" || !Array.isArray(envelope.profiles)) return emptyEnvelope();\n  const base = emptyEnvelope();\n  const template = createEmptyProfile({ id: \"t\", now: \"\", fallbackName: \"\" });\n  const profiles = envelope.profiles.filter(Boolean).map(p => {\n    const merged = { ...template, ...p, schemaVersion: PROFILE_SCHEMA_VERSION };\n    for (const key of [\"meta\", \"use\", \"hardware\", \"selection\", \"derived\", \"runCard\", \"routing\"]) {\n      merged[key] = { ...template[key], ...(p[key] || {}) };\n    }\n    merged.meta.seen = { ...(p.meta && p.meta.seen) || {} };\n    merged.runCard.runs = Array.isArray(merged.runCard.runs) ? merged.runCard.runs : [];\n    return merged;\n  });\n  return { ...base, activeProfileId: envelope.activeProfileId || null, profiles };\n}\n\n/**\n * @param storage  localStorage-like ({getItem,setItem,removeItem})\n * @param options  {now, idFactory, derive} — `derive(profile)` returns a fresh derived snapshot.\n */\nexport function createStore(storage, options = {}) {\n  const now = options.now || defaultNow;\n  const idFactory = options.idFactory || defaultId;\n  let derive = options.derive || null;\n\n  let state = load();\n\n  function load() {\n    try {\n      const raw = storage.getItem(STORE_KEY);\n      return raw ? migrate(JSON.parse(raw)) : emptyEnvelope();\n    } catch (err) {\n      console.warn(\"Perfiles ilegibles en localStorage; se empieza vacío.\", err);\n      return emptyEnvelope();\n    }\n  }\n\n  function persist() {\n    try {\n      storage.setItem(STORE_KEY, JSON.stringify(state));\n    } catch (err) {\n      console.warn(\"No se pudo guardar en localStorage.\", err);\n    }\n  }\n\n  function find(id) {\n    return state.profiles.find(p => p.id === id) || null;\n  }\n\n  function applyDerived(profile) {\n    if (!derive) return profile;\n    profile.derived = derive(profile);\n    return profile;\n  }\n\n  function autoRename(profile) {\n    if (profile.nameMode === \"manual\") return;\n    const index = state.profiles.indexOf(profile) + 1;\n    profile.name = autoProfileName(profile, index || state.profiles.length + 1, options.taskOptions || null);\n  }\n\n  return {\n    setDerive(fn) { derive = fn; },\n\n    listProfiles() { return state.profiles.map(p => structuredClone(p)); },\n\n    getActiveId() { return state.activeProfileId; },\n\n    getProfile(id) {\n      const p = find(id);\n      return p ? structuredClone(p) : null;\n    },\n\n    getActiveProfile() {\n      return state.activeProfileId ? this.getProfile(state.activeProfileId) : null;\n    },\n\n    createProfile(seed) {\n      const id = idFactory();\n      const stamp = now();\n      const fallback = `New profile ${state.profiles.length + 1}`;\n      const profile = createEmptyProfile({ id, now: stamp, fallbackName: fallback });\n      if (seed) {\n        for (const key of [\"use\", \"hardware\", \"selection\"]) {\n          if (seed[key]) profile[key] = { ...profile[key], ...structuredClone(seed[key]) };\n        }\n        if (seed.meta && seed.meta.seen) profile.meta.seen = { ...seed.meta.seen };\n      }\n      state.profiles.push(profile);\n      state.activeProfileId = id;\n      autoRename(profile);\n      applyDerived(profile);\n      persist();\n      return structuredClone(profile);\n    },\n\n    adoptProfile(profile) {\n      state.profiles.push(profile);\n      state.activeProfileId = profile.id;\n      autoRename(profile);\n      applyDerived(profile);\n      persist();\n      return structuredClone(profile);\n    },\n\n    updateProfile(id, updater) {\n      const profile = find(id);\n      if (!profile) return null;\n      updater(profile);\n      profile.updatedAt = now();\n      autoRename(profile);\n      applyDerived(profile);\n      persist();\n      return structuredClone(profile);\n    },\n\n    renameProfile(id, name) {\n      const profile = find(id);\n      if (!profile) return null;\n      const trimmed = String(name || \"\").trim();\n      if (!trimmed) return structuredClone(profile);\n      profile.name = trimmed;\n      profile.nameMode = \"manual\";\n      profile.updatedAt = now();\n      persist();\n      return structuredClone(profile);\n    },\n\n    clearProfile(id) {\n      const profile = find(id);\n      if (!profile) return null;\n      const keptName = profile.nameMode === \"manual\" ? profile.name : null;\n      const fresh = createEmptyProfile({\n        id: profile.id,\n        now: profile.createdAt,\n        fallbackName: keptName || `New profile ${state.profiles.indexOf(profile) + 1}`\n      });\n      fresh.createdAt = profile.createdAt;\n      fresh.updatedAt = now();\n      if (keptName) { fresh.name = keptName; fresh.nameMode = \"manual\"; }\n      state.profiles[state.profiles.indexOf(profile)] = fresh;\n      autoRename(fresh);\n      applyDerived(fresh);\n      persist();\n      return structuredClone(fresh);\n    },\n\n    deleteProfile(id) {\n      const index = state.profiles.findIndex(p => p.id === id);\n      if (index \u003c 0) return null;\n      state.profiles.splice(index, 1);\n      if (state.activeProfileId === id) {\n        state.activeProfileId = state.profiles.length ? state.profiles[0].id : null;\n      }\n      persist();\n      return state.activeProfileId;\n    },\n\n    setActive(id) {\n      if (id !== null && !find(id)) return null;\n      state.activeProfileId = id;\n      persist();\n      return id;\n    },\n\n    /** Recompute every profile whose derived snapshot was stamped with an older dataset version. */\n    refreshDerived(dataVersion) {\n      let changed = false;\n      for (const profile of state.profiles) {\n        if (!profile.derived || profile.derived.dataVersion !== dataVersion) {\n          applyDerived(profile);\n          changed = true;\n        }\n      }\n      if (changed) persist();\n      return changed;\n    },\n\n    serializedState() { return JSON.stringify(state); }\n  };\n}\n\nexport function autoProfileName(profile, fallbackIndex, taskOptions) {\n  const taskId = profile.use && profile.use.taskFamily;\n  const ram = profile.hardware && profile.hardware.ramGB;\n  const lang = profile.use && profile.use.language;\n\n  const known = [taskId, ram, lang].filter(v => v !== null && v !== undefined && v !== \"\").length;\n  if (known \u003c 2) return `New profile ${fallbackIndex}`;\n\n  let taskLabel = null;\n  let languageLabel = null;\n  if (taskOptions) {\n    const family = (taskOptions.taskFamilies || []).find(t => t.id === taskId);\n    taskLabel = family ? family.label : null;\n    languageLabel = lang && taskOptions.languageLabels ? taskOptions.languageLabels[lang] : null;\n  }\n  if (!taskLabel && taskId) taskLabel = taskId;\n  if (!languageLabel && lang) languageLabel = lang;\n\n  return `${taskLabel ?? \"New profile\"} · ${ram ? `${ram} GB` : \"? RAM\"} · ${languageLabel ?? \"? language\"}`;\n}\n","js/state/schema.js":"export const PROFILE_SCHEMA_VERSION = 1;\n\nexport function createEmptyProfile({ id, now, fallbackName }) {\n  return {\n    id,\n    schemaVersion: PROFILE_SCHEMA_VERSION,\n    createdAt: now,\n    updatedAt: now,\n    name: fallbackName,\n    nameMode: \"auto\",\n    meta: {\n      seen: {}\n    },\n    use: {\n      taskFamily: null,\n      interactionDynamic: null,\n      language: null,\n      privacy: null,\n      currentWeb: null,\n      errorCost: null,\n      materialLength: null\n    },\n    hardware: {\n      os: null,\n      ramGB: null,\n      graphicsType: null,\n      vramGB: null,\n      unifiedMemoryGB: null,\n      storageFreeGB: null\n    },\n    selection: {\n      selectedModelId: null,\n      quantization: null,\n      contextTokens: null\n    },\n    derived: {\n      dataVersion: null,\n      hardwareFit: null,\n      taskFit: null,\n      operationalFit: null,\n      candidateIds: [],\n      recommendedQuantization: null,\n      recommendedContextTokens: null\n    },\n    runCard: {\n      runner: \"\",\n      runs: []\n    },\n    routing: {\n      choice: null,\n      decisionFingerprint: null\n    }\n  };\n}\n\nexport function createRunRecord({ id, now, profile, benchmarkVersion }) {\n  return {\n    id,\n    createdAt: now,\n    benchmarkVersion: benchmarkVersion || null,\n    modelId: profile.selection.selectedModelId,\n    quantization: profile.selection.quantization,\n    contextTokens: profile.selection.contextTokens,\n    runner: profile.runCard.runner || \"\",\n    generationTimeSeconds: null,\n    tokensPerSecond: null,\n    ttftSeconds: null,\n    evaluation: null,\n    observations: \"\"\n  };\n}\n\n/** Fields the store is allowed to persist. Anything else (pasted response bodies) stays in memory. */\nexport const PERSISTED_TOP_LEVEL_KEYS = Object.freeze([\n  \"id\", \"schemaVersion\", \"createdAt\", \"updatedAt\", \"name\", \"nameMode\",\n  \"meta\", \"use\", \"hardware\", \"selection\", \"derived\", \"runCard\", \"routing\"\n]);\n","js/state/session.js":"/**\n * Memory-only session state.\n *\n * The complete pasted benchmark response lives here and nowhere else:\n * never localStorage, sessionStorage, IndexedDB, the URL, or the service worker.\n */\nexport function createSessionState() {\n  const responses = new Map();\n  const ui = { draftRunId: null, lastEvaluation: null, customContext: false };\n\n  return {\n    setBenchmarkResponse(runId, text) {\n      if (!runId) return;\n      responses.set(runId, String(text ?? \"\"));\n    },\n    getBenchmarkResponse(runId) {\n      return responses.has(runId) ? responses.get(runId) : null;\n    },\n    hasBenchmarkResponse(runId) {\n      return responses.has(runId) && responses.get(runId).trim().length > 0;\n    },\n    clearBenchmarkResponse(runId) {\n      responses.delete(runId);\n    },\n    responseRunIds() {\n      return [...responses.keys()];\n    },\n    ui,\n    /** Deliberately excludes response bodies — used by tests to prove they are not serializable. */\n    serializableState() {\n      return { responseRunIds: [...responses.keys()], ui: { draftRunId: ui.draftRunId } };\n    }\n  };\n}\n","js/state/explore.js":"/**\n * Explore sandbox: an in-memory structured clone of a profile.\n * Nothing here is serialized until `Apply to profile` resolves.\n */\nexport function createExploreState() {\n  let working = null;\n  let originId = null;\n  let originKind = null;\n  let baseline = null;\n\n  return {\n    isActive() { return working !== null; },\n    get profile() { return working; },\n    get baselineProfile() { return baseline; },\n    get originProfileId() { return originId; },\n    get originKind() { return originKind; },\n\n    begin(profile, kind) {\n      working = structuredClone(profile);\n      baseline = structuredClone(profile);\n      originId = profile.id;\n      originKind = kind || \"user\";\n      return working;\n    },\n\n    update(mutator) {\n      if (!working) return null;\n      mutator(working);\n      return working;\n    },\n\n    setDerived(derived) {\n      if (working) working.derived = derived;\n      return working;\n    },\n\n    discard() {\n      working = null;\n      baseline = null;\n      originId = null;\n      originKind = null;\n    },\n\n    /** Returns the sandbox payload for Apply; the caller decides new-vs-overwrite. */\n    payload() {\n      if (!working) return null;\n      return {\n        use: structuredClone(working.use),\n        hardware: structuredClone(working.hardware),\n        selection: structuredClone(working.selection),\n        meta: { seen: structuredClone(working.meta.seen || {}) }\n      };\n    }\n  };\n}\n\nexport function explainDerivedChange(before, after) {\n  const changes = [];\n  if (!before || !after) return changes;\n  for (const key of [\"hardwareFit\", \"taskFit\", \"operationalFit\", \"recommendedQuantization\", \"recommendedContextTokens\"]) {\n    if (JSON.stringify(before[key]) !== JSON.stringify(after[key])) changes.push(key);\n  }\n  return changes;\n}\n","js/state/demos.js":"import { createEmptyProfile } from \"lmb:js/state/schema.js\";\n\nexport function listDemos(demos) {\n  return (demos || []).map(d => Object.freeze(structuredClone(d)));\n}\n\nexport function getDemo(id, demos) {\n  const found = (demos || []).find(d => d.id === id);\n  return found ? Object.freeze(structuredClone(found)) : null;\n}\n\n/** A demo rendered as a read-only profile shape, so sections can display it without special cases. */\nexport function demoAsProfile(demo) {\n  const profile = createEmptyProfile({\n    id: demo.id,\n    now: demo.verifiedAt || \"1970-01-01T00:00:00.000Z\",\n    fallbackName: demo.name\n  });\n  profile.name = demo.name;\n  profile.nameMode = \"manual\";\n  profile.use = { ...profile.use, ...structuredClone(demo.use || {}) };\n  profile.hardware = { ...profile.hardware, ...structuredClone(demo.hardware || {}) };\n  profile.selection = { ...profile.selection, ...structuredClone(demo.selection || {}) };\n  profile.meta.seen = { readModel: true };\n  profile.meta.demoSourceId = demo.id;\n  return profile;\n}\n\n/**\n * Clones a demo into a user-owned profile. Never mutates the demo source object.\n */\nexport function cloneDemoToUser(demo, { id, now, fallbackName }) {\n  const source = structuredClone(demo);\n  const profile = createEmptyProfile({ id, now, fallbackName: fallbackName || `${source.name} (copia)` });\n  profile.use = { ...profile.use, ...structuredClone(source.use || {}) };\n  profile.hardware = { ...profile.hardware, ...structuredClone(source.hardware || {}) };\n  profile.selection = { ...profile.selection, ...structuredClone(source.selection || {}) };\n  profile.nameMode = \"auto\";\n  profile.meta.clonedFromDemoId = source.id;\n  profile.meta.seen = { readModel: true };\n  return profile;\n}\n","js/domain/derive.js":"import { computeHardwareFit } from \"lmb:js/domain/hardware-fit.js\";\nimport { computeTaskFit } from \"lmb:js/domain/task-fit.js\";\nimport { computeOperationalFit } from \"lmb:js/domain/operational-fit.js\";\nimport { recommendQuantization } from \"lmb:js/domain/quantization.js\";\nimport { recommendContext } from \"lmb:js/domain/context.js\";\nimport { rankCandidates } from \"lmb:js/domain/recommendations.js\";\n\n/** Slim per-candidate record kept in the persisted derived snapshot. */\nfunction slimCandidate(c) {\n  return {\n    modelId: c.modelId,\n    family: c.family,\n    quantization: c.quantization,\n    contextTokens: c.contextTokens,\n    hardwareFit: c.hardwareFit,\n    taskFit: c.taskFit,\n    operationalFit: c.operationalFit,\n    tradeoff: c.tradeoff,\n    warnings: c.warnings\n  };\n}\n\n/**\n * The only recomputation entry point. Never mutates profile or datasets.\n */\nexport function deriveProfile(profile, datasets) {\n  const rules = datasets.hardwareRules;\n  const models = datasets.models || [];\n  const candidates = rankCandidates(profile, models, rules).map(slimCandidate);\n\n  const selected = models.find(m => m.id === profile.selection.selectedModelId) || null;\n\n  let hardwareFit = null;\n  let taskFit = null;\n  let operationalFit = null;\n  let recommendedQuantization = null;\n  let recommendedContextTokens = null;\n  let effectiveQuantization = null;\n  let effectiveContextTokens = null;\n  let warnings = [];\n\n  if (selected) {\n    const q = recommendQuantization(profile, selected, rules);\n    recommendedQuantization = q.quantization;\n    effectiveQuantization = profile.selection.quantization || recommendedQuantization;\n\n    const c = recommendContext(profile, selected, effectiveQuantization, rules);\n    recommendedContextTokens = c.contextTokens;\n    effectiveContextTokens = Number(profile.selection.contextTokens) || recommendedContextTokens;\n\n    hardwareFit = computeHardwareFit(profile, selected, effectiveQuantization, effectiveContextTokens, rules);\n    taskFit = computeTaskFit(profile, selected);\n    operationalFit = computeOperationalFit(profile, {\n      hardwareFit,\n      taskFit,\n      recommendedContextTokens: effectiveContextTokens\n    });\n    warnings = [...q.warnings, ...c.warnings];\n  }\n\n  return {\n    dataVersion: (datasets.version && datasets.version.dataVersion) || null,\n    hardwareFit,\n    taskFit,\n    operationalFit,\n    candidateIds: candidates.map(c => c.modelId),\n    candidates,\n    recommendedQuantization,\n    recommendedContextTokens,\n    effectiveQuantization,\n    effectiveContextTokens,\n    warnings\n  };\n}\n","js/domain/hardware-fit.js":"/**\n * Hardware Fit — \"can this run safely and reasonably on this device?\"\n * Pure, explainable, and conservative. Never claims a guarantee.\n */\n\nexport function effectiveMemoryGB(hardware) {\n  if (!hardware) return null;\n  const ram = num(hardware.ramGB);\n  const unified = hardware.graphicsType === \"unified\" ? num(hardware.unifiedMemoryGB) : null;\n  if (ram === null && unified === null) return null;\n  return Math.max(ram ?? 0, unified ?? 0) || null;\n}\n\nfunction num(value) {\n  const n = Number(value);\n  return Number.isFinite(n) && n > 0 ? n : null;\n}\n\nexport function variantOf(model, quantId) {\n  if (!model || !Array.isArray(model.quantizations)) return null;\n  return model.quantizations.find(q => q.id === quantId) || null;\n}\n\nexport function computeHardwareFit(profile, model, quantId, contextTokens, hardwareRules) {\n  const rules = hardwareRules || {};\n  const variant = variantOf(model, quantId);\n  if (!variant) {\n    return {\n      status: \"unknown\",\n      reasons: [\"Esa cuantización no está en el catálogo para este modelo.\"],\n      estimate: null\n    };\n  }\n\n  const ctx = Number(contextTokens) > 0 ? Number(contextTokens) : 0;\n  const contextExtraGB = round1((ctx / 1024) * variant.contextOverheadGBPer1k);\n  const minRequiredGB = round1(variant.minRamGB + contextExtraGB);\n  const comfortableRequiredGB = round1(variant.comfortableRamGB + contextExtraGB);\n  const storageRequiredGB = round1(variant.downloadGB + (rules.storageBufferGB ?? 0));\n\n  const estimate = { minRequiredGB, comfortableRequiredGB, storageRequiredGB, contextExtraGB, contextTokens: ctx };\n  const memory = effectiveMemoryGB(profile.hardware);\n  const storage = num(profile.hardware && profile.hardware.storageFreeGB);\n  const reasons = [];\n\n  if (memory === null) {\n    reasons.push(\"Falta la RAM del equipo, así que el ajuste de hardware no se puede calcular.\");\n    return { status: \"unknown\", reasons, estimate };\n  }\n\n  if (storage !== null && storage \u003c storageRequiredGB) {\n    reasons.push(`El archivo más espacio de trabajo pide ~${storageRequiredGB} GB y hay ${storage} GB libres.`);\n    return { status: \"not_viable\", reasons, estimate };\n  }\n  if (storage === null) {\n    reasons.push(\"Almacenamiento libre no informado: no se verificó el espacio de descarga.\");\n  }\n\n  if (memory \u003c minRequiredGB) {\n    reasons.push(`Pide al menos ~${minRequiredGB} GB con ${ctx} tokens de contexto y el equipo declara ${memory} GB.`);\n    return { status: \"not_viable\", reasons, estimate };\n  }\n\n  if (memory \u003c comfortableRequiredGB) {\n    reasons.push(`Entra en ~${minRequiredGB} GB pero deja holgura cómoda sólo desde ~${comfortableRequiredGB} GB.`);\n    reasons.push(\"Con el navegador o una videollamada abiertos, esta combinación queda al borde.\");\n    return { status: \"tight\", reasons, estimate };\n  }\n\n  reasons.push(`Queda holgura: ~${comfortableRequiredGB} GB recomendados contra ${memory} GB declarados.`);\n  return { status: \"comfortable\", reasons, estimate };\n}\n\n/** \"What would need to change?\" — derived from the same numbers, no invented prose. */\nexport function hardwareFitRemedies(fit) {\n  if (!fit || !fit.estimate) return [];\n  const out = [];\n  if (fit.status === \"tight\" || fit.status === \"not_viable\") {\n    out.push(\"Bajar el contexto un escalón reduce la memoria reservada.\");\n    out.push(\"Una cuantización más liviana baja el mínimo y el punto cómodo.\");\n    out.push(\"Un modelo más pequeño del catálogo cambia el sobre completo.\");\n    out.push(`Con ~${fit.estimate.comfortableRequiredGB} GB de memoria disponible esta combinación pasaría a cómoda.`);\n  }\n  return out;\n}\n\nfunction round1(n) {\n  return Math.round(Number(n) * 10) / 10;\n}\n","js/domain/task-fit.js":"/**\n * Task Fit — explicit catalog lookup over (task family × interaction dynamic).\n * No semantic inference, no name-based guessing.\n */\nexport function computeTaskFit(profile, model) {\n  const task = profile.use.taskFamily;\n  const dynamic = profile.use.interactionDynamic;\n  if (!task || !dynamic) {\n    return { status: \"unknown\", reasons: [\"Falta tarea o dinámica de interacción.\"] };\n  }\n  const status = (model && model.taskFit && model.taskFit[task] && model.taskFit[task][dynamic]) || \"unknown\";\n  const reasons = [];\n  if (status === \"unknown\") {\n    reasons.push(\"El mapa de compatibilidad no tiene un valor para esta combinación.\");\n  } else if (status === \"wrong\") {\n    reasons.push(\"El mapa de compatibilidad marca esta combinación como herramienta equivocada, no como riesgo de hardware.\");\n  } else if (status === \"stretch\") {\n    reasons.push(\"El mapa de compatibilidad la marca al límite: funciona, con supervisión.\");\n  }\n  return { status, reasons, provenance: \"COMPATIBILITY_MAP\" };\n}\n","js/domain/operational-fit.js":"/**\n * Operational Fit — \"even if it runs and can do the task, does local execution make sense here?\"\n * Structural rules only. No speed thresholds invented by the Bench.\n */\nexport function computeOperationalFit(profile, context) {\n  const { hardwareFit, taskFit, recommendedContextTokens } = context || {};\n  const use = profile.use || {};\n  const reasons = [];\n  const unknowns = [];\n  let status = \"good\";\n\n  const worsen = (next) => {\n    const order = { good: 3, tradeoffs: 2, poor: 1, unknown: 0 };\n    if (order[next] \u003c order[status]) status = next;\n  };\n\n  if (use.currentWeb === true) {\n    status = \"poor\";\n    reasons.push(\"La tarea necesita información actual de la web y un modelo local por sí solo no la tiene.\");\n  }\n\n  if (use.errorCost === \"high\" && taskFit && taskFit.status === \"wrong\") {\n    status = \"poor\";\n    reasons.push(\"Costo de error alto sobre una combinación marcada como herramienta equivocada.\");\n  } else if (use.errorCost === \"high\" && taskFit && taskFit.status === \"stretch\") {\n    worsen(\"tradeoffs\");\n    reasons.push(\"Costo de error alto con ajuste de tarea al límite: exige revisión humana de cada salida.\");\n  }\n\n  if (use.materialLength === \"long\" && Number(recommendedContextTokens) > 0 && Number(recommendedContextTokens) \u003c 16384) {\n    worsen(\"tradeoffs\");\n    reasons.push(`Material largo con contexto de ${recommendedContextTokens} tokens: habrá que partir el material en trozos.`);\n  }\n\n  if (hardwareFit && hardwareFit.status === \"tight\") {\n    worsen(\"tradeoffs\");\n    reasons.push(\"El hardware queda al borde, así que la estabilidad depende de qué más esté abierto.\");\n  }\n  if (hardwareFit && hardwareFit.status === \"not_viable\") {\n    status = \"poor\";\n    reasons.push(\"El ajuste de hardware no es viable en este equipo con esta combinación.\");\n  }\n\n  if (use.privacy === \"must_stay_local\") {\n    reasons.push(\"El material no puede salir del equipo: eso es una presión a favor de lo local, no una mejora del ajuste de tarea.\");\n  }\n\n  for (const [key, label] of [\n    [\"privacy\", \"sensibilidad del material\"],\n    [\"currentWeb\", \"necesidad de información actual\"],\n    [\"errorCost\", \"costo del error\"],\n    [\"materialLength\", \"largo del material\"]\n  ]) {\n    if (use[key] === null || use[key] === undefined) unknowns.push(label);\n  }\n  if (unknowns.length) {\n    reasons.push(`Sin dato de ${unknowns.join(\", \")}: se informa como desconocido, no se supone.`);\n  }\n\n  if (!taskFit || taskFit.status === \"unknown\") {\n    if (status === \"good\") status = \"unknown\";\n    reasons.push(\"Sin ajuste de tarea no hay base para juzgar el sentido operativo.\");\n  }\n\n  return { status, reasons, unknowns };\n}\n","js/domain/quantization.js":"import { computeHardwareFit } from \"lmb:js/domain/hardware-fit.js\";\nimport { desiredContext } from \"lmb:js/domain/context.js\";\n\n/** Catalog variants ordered by the rules' quality-first preference. */\nexport function orderedVariants(model, rules) {\n  const pref = (rules && rules.quantizationPreference) || [];\n  const list = Array.isArray(model && model.quantizations) ? model.quantizations.slice() : [];\n  return list.sort((a, b) => {\n    const ia = pref.indexOf(a.id), ib = pref.indexOf(b.id);\n    return (ia \u003c 0 ? 99 : ia) - (ib \u003c 0 ? 99 : ib);\n  });\n}\n\n/**\n * Targets Comfortable Fit, not maximum possible fit.\n * @returns {{quantization: string|null, basis: string, warnings: string[]}}\n */\nexport function recommendQuantization(profile, model, rules) {\n  const variants = orderedVariants(model, rules);\n  if (!variants.length) {\n    return { quantization: null, basis: \"unavailable\", warnings: [\"El catálogo no lista cuantizaciones para este modelo.\"] };\n  }\n\n  const ctx = desiredContext(profile, model, rules);\n  let firstTight = null;\n  let sawUnknown = false;\n\n  for (const variant of variants) {\n    const fit = computeHardwareFit(profile, model, variant.id, ctx, rules);\n    if (fit.status === \"comfortable\") {\n      return { quantization: variant.id, basis: \"comfortable\", warnings: [] };\n    }\n    if (fit.status === \"tight\" && !firstTight) firstTight = variant.id;\n    if (fit.status === \"unknown\") sawUnknown = true;\n  }\n\n  if (sawUnknown && !firstTight) {\n    return {\n      quantization: variants[0].id,\n      basis: \"unknown_hardware\",\n      warnings: [\"Sin datos de hardware la recomendación es provisional: se muestra la variante de mayor calidad del catálogo.\"]\n    };\n  }\n\n  if (firstTight) {\n    return {\n      quantization: firstTight,\n      basis: \"tight\",\n      warnings: [\"Ninguna variante llega a ajuste cómodo con este contexto; la recomendada queda al borde.\"]\n    };\n  }\n\n  const smallest = variants.slice().sort((a, b) => a.downloadGB - b.downloadGB)[0];\n  return {\n    quantization: smallest.id,\n    basis: \"smallest\",\n    warnings: [\"Ninguna variante entra en este equipo; se muestra la de menor huella para poder explicar por qué.\"]\n  };\n}\n","js/domain/context.js":"import { computeHardwareFit } from \"lmb:js/domain/hardware-fit.js\";\n\nfunction tiers(rules) {\n  const list = ((rules && rules.contextChoices) || [4096, 8192, 16384, 32768]).slice();\n  return list.sort((a, b) => a - b);\n}\n\n/** Desired context before any hardware downshift. */\nexport function desiredContext(profile, model, rules) {\n  const steps = tiers(rules);\n  const byDynamic = (rules && rules.desiredContextByDynamic) || {};\n  let desired = byDynamic[profile.use.interactionDynamic] || steps[0];\n\n  const raiseFor = (rules && rules.raiseContextForTaskFamilies) || [];\n  if (raiseFor.includes(profile.use.taskFamily)) {\n    const i = steps.indexOf(desired);\n    if (i >= 0 && i \u003c steps.length - 1) desired = steps[i + 1];\n  }\n\n  if (profile.use.materialLength === \"long\") {\n    desired = Math.max(desired, (rules && rules.longMaterialMinContextTokens) || desired);\n  }\n\n  const modelMax = Number(model && model.maxContextTokens) || steps[steps.length - 1];\n  desired = Math.min(desired, modelMax);\n\n  const allowed = steps.filter(t => t \u003c= desired);\n  return allowed.length ? allowed[allowed.length - 1] : steps[0];\n}\n\n/**\n * Conservative context recommendation: start from the desired tier, then downshift\n * until Hardware Fit is Comfortable or the smallest tier is reached.\n */\nexport function recommendContext(profile, model, quantId, rules) {\n  const steps = tiers(rules);\n  const desired = desiredContext(profile, model, rules);\n  const descending = steps.filter(t => t \u003c= desired).sort((a, b) => b - a);\n  const warnings = [];\n\n  for (const candidate of descending) {\n    const fit = computeHardwareFit(profile, model, quantId, candidate, rules);\n    if (fit.status === \"comfortable\") {\n      return {\n        contextTokens: candidate,\n        desiredContextTokens: desired,\n        basis: candidate === desired ? \"desired\" : \"downshifted\",\n        warnings: candidate === desired ? [] : [`Se bajó de ${desired} a ${candidate} tokens para dejar holgura de memoria.`]\n      };\n    }\n    if (fit.status === \"unknown\") {\n      return {\n        contextTokens: candidate,\n        desiredContextTokens: desired,\n        basis: \"unknown_hardware\",\n        warnings: [\"Sin datos de hardware el contexto recomendado es el que pide la dinámica de interacción, sin verificar memoria.\"]\n      };\n    }\n  }\n\n  const minimum = descending.length ? descending[descending.length - 1] : steps[0];\n  warnings.push(`Ni con ${minimum} tokens el ajuste llega a cómodo con esta combinación.`);\n  return { contextTokens: minimum, desiredContextTokens: desired, basis: \"minimum\", warnings };\n}\n","js/domain/recommendations.js":"import { computeHardwareFit } from \"lmb:js/domain/hardware-fit.js\";\nimport { computeTaskFit } from \"lmb:js/domain/task-fit.js\";\nimport { computeOperationalFit } from \"lmb:js/domain/operational-fit.js\";\nimport { recommendQuantization } from \"lmb:js/domain/quantization.js\";\nimport { recommendContext } from \"lmb:js/domain/context.js\";\n\n/** Ordinals exist only to sort. They are never summed, averaged, or shown. */\nconst HARDWARE = { comfortable: 2, tight: 1, not_viable: 0, unknown: -1 };\nconst TASK = { good: 2, stretch: 1, wrong: 0, unknown: -1 };\nconst OPERATIONAL = { good: 2, tradeoffs: 1, poor: 0, unknown: -1 };\n\nexport function evaluateModel(profile, model, rules) {\n  const q = recommendQuantization(profile, model, rules);\n  const c = recommendContext(profile, model, q.quantization, rules);\n  const hardwareFit = computeHardwareFit(profile, model, q.quantization, c.contextTokens, rules);\n  const taskFit = computeTaskFit(profile, model);\n  const operationalFit = computeOperationalFit(profile, {\n    hardwareFit,\n    taskFit,\n    recommendedContextTokens: c.contextTokens\n  });\n\n  return {\n    modelId: model.id,\n    family: model.family,\n    publisher: model.publisher,\n    parameters: model.parameters,\n    quantization: q.quantization,\n    quantizationBasis: q.basis,\n    contextTokens: c.contextTokens,\n    contextBasis: c.basis,\n    desiredContextTokens: c.desiredContextTokens,\n    hardwareFit,\n    taskFit,\n    operationalFit,\n    warnings: [...q.warnings, ...c.warnings],\n    tradeoff: primaryTradeoff({ hardwareFit, taskFit, operationalFit, model })\n  };\n}\n\nexport function primaryTradeoff({ hardwareFit, taskFit, operationalFit, model }) {\n  if (hardwareFit.status === \"not_viable\") return \"No entra en este equipo con esta combinación.\";\n  if (taskFit.status === \"wrong\") return \"Corre, pero el mapa lo marca como herramienta equivocada para esta tarea.\";\n  if (hardwareFit.status === \"tight\") return \"Entra al borde: la estabilidad depende de qué más esté abierto.\";\n  if (operationalFit.status === \"poor\") return \"Corre y sirve para la tarea, pero el sentido operativo es débil aquí.\";\n  if (taskFit.status === \"stretch\") return \"Sirve con supervisión; no para trabajo crítico sin revisión.\";\n  if (operationalFit.status === \"tradeoffs\") return \"Combinación razonable con concesiones declaradas.\";\n  return (model && model.hardwareNote) || \"Sin concesión dominante con los datos actuales.\";\n}\n\n/**\n * Up to three candidates, ordered lexicographically:\n * hardware safety, then Task Fit, then Operational Fit.\n */\nexport function rankCandidates(profile, models, rules) {\n  const evaluated = (models || []).map(model => evaluateModel(profile, model, rules));\n  evaluated.sort((a, b) => {\n    const h = HARDWARE[b.hardwareFit.status] - HARDWARE[a.hardwareFit.status];\n    if (h !== 0) return h;\n    const t = TASK[b.taskFit.status] - TASK[a.taskFit.status];\n    if (t !== 0) return t;\n    const o = OPERATIONAL[b.operationalFit.status] - OPERATIONAL[a.operationalFit.status];\n    if (o !== 0) return o;\n    return String(a.modelId).localeCompare(String(b.modelId));\n  });\n  return evaluated.slice(0, 3);\n}\n\nexport function hasComfortableMatch(candidates) {\n  return (candidates || []).some(c => c.hardwareFit.status === \"comfortable\");\n}\n","js/domain/completion.js":"import { ROUTES } from \"lmb:js/routes.js\";\n\nconst positive = (v) => Number(v) > 0;\n\n/** Pure selectors. Remove the data and completion goes back to false. */\nexport const SELECTORS = Object.freeze({\n  \"use\": p => Boolean(p.use.taskFamily && p.use.interactionDynamic),\n  \"hardware\": p => Boolean(p.hardware.os) && positive(p.hardware.ramGB) &&\n                   Boolean(p.hardware.graphicsType) && positive(p.hardware.storageFreeGB),\n  \"read-model\": p => Boolean(p.meta && p.meta.seen && p.meta.seen.readModel),\n  \"candidates\": p => Array.isArray(p.derived && p.derived.candidateIds) && p.derived.candidateIds.length > 0,\n  \"select-model\": p => Boolean(p.selection.selectedModelId),\n  \"quant-context\": p => Boolean(p.selection.quantization) && positive(p.selection.contextTokens),\n  \"runners\": p => Boolean(p.runCard && String(p.runCard.runner || \"\").trim()),\n  \"runner\": p => Boolean(p.meta && p.meta.seen && p.meta.seen.runner),\n  \"pocketpal\": p => Boolean(p.meta && p.meta.seen && p.meta.seen.pocketpal),\n  \"build-test\": p => Boolean(p.runCard && p.runCard.runs.some(r =>\n      r.benchmarkVersion && r.modelId && String(r.runner || \"\").trim())),\n  \"evaluate\": p => Boolean(p.runCard && p.runCard.runs.some(r => r.evaluation)),\n  \"troubleshooting\": p => Boolean(p.meta && p.meta.seen && p.meta.seen.troubleshooting),\n  \"routing\": p => Boolean(p.routing && p.routing.choice),\n  \"plan\": p => Boolean(p.routing && p.routing.choice) &&\n               Boolean(p.selection.selectedModelId) &&\n               Boolean(p.runCard && p.runCard.runs.some(r => r.evaluation))\n});\n\nexport function computeCompletion(profile) {\n  const out = {};\n  for (const id of ROUTES) {\n    const selector = SELECTORS[id];\n    try {\n      out[id] = selector ? Boolean(selector(profile)) : false;\n    } catch (err) {\n      out[id] = false;\n    }\n  }\n  return out;\n}\n\nexport function completionCount(completion) {\n  const done = ROUTES.filter(id => completion[id]).length;\n  return { done, total: ROUTES.length };\n}\n","js/ui/dom.js":"const SVG_TAGS = new Set([\"svg\", \"path\", \"circle\", \"rect\", \"g\", \"line\"]);\n\nexport function el(tag, props, ...children) {\n  const node = SVG_TAGS.has(tag)\n    ? document.createElementNS(\"http://www.w3.org/2000/svg\", tag)\n    : document.createElement(tag);\n\n  if (props) {\n    for (const [key, value] of Object.entries(props)) {\n      if (value === null || value === undefined || value === false) continue;\n      if (key === \"class\") node.setAttribute(\"class\", value);\n      else if (key === \"text\") node.textContent = String(value);\n      else if (key === \"style\" && typeof value === \"object\") Object.assign(node.style, value);\n      else if (key === \"dataset\") Object.assign(node.dataset, value);\n      else if (key.startsWith(\"on\") && typeof value === \"function\") {\n        node.addEventListener(key.slice(2).toLowerCase(), value);\n      } else if (key === \"value\" && (tag === \"input\" || tag === \"textarea\" || tag === \"select\")) {\n        node.value = value;\n      } else if (value === true) node.setAttribute(key, \"\");\n      else node.setAttribute(key, String(value));\n    }\n  }\n\n  append(node, children);\n  return node;\n}\n\nexport function append(node, children) {\n  for (const child of children.flat(Infinity)) {\n    if (child === null || child === undefined || child === false) continue;\n    node.appendChild(typeof child === \"object\" && child.nodeType ? child : document.createTextNode(String(child)));\n  }\n  return node;\n}\n\nexport function frag(...children) {\n  const f = document.createDocumentFragment();\n  append(f, children);\n  return f;\n}\n\n/** External canonical sources render as a compact button, never as a raw URL. */\nexport function canonicalLink(url, label) {\n  if (!url) return null;\n  return el(\"a\", {\n    class: \"btn quiet canonical-link\",\n    href: url,\n    target: \"_blank\",\n    rel: \"noopener noreferrer\"\n  }, label || \"Fuente canónica ↗\");\n}\n\n/**\n * Wide data tables scroll inside their own box instead of widening the page,\n * the same treatment \u003cpre> already gets. Keeps real table semantics for AT,\n * unlike putting display:block on the table itself.\n */\nexport function dataTable(...children) {\n  return el(\"div\", { class: \"table-scroll\" }, el(\"table\", { class: \"data\" }, ...children));\n}\n\nexport function clear(node) {\n  while (node.firstChild) node.removeChild(node.
