entName, onRename) {\n  const input = el(\"input\", { type: \"text\", value: currentName || \"\", id: \"rename-input\" });\n  const dialog = el(\"dialog\", { \"aria-label\": \"Renombrar perfil\" },\n    el(\"h3\", { text: \"Renombrar perfil\" }),\n    el(\"p\", { class: \"small muted\", text: \"Después de renombrar manualmente, el nombre deja de actualizarse solo.\" }),\n    el(\"div\", { class: \"field\" }, el(\"label\", { for: \"rename-input\", text: \"Nombre\" }), input),\n    el(\"div\", { class: \"dialog-actions\" },\n      el(\"button\", {\n        type: \"button\", class: \"btn accent\",\n        onClick: () => { const v = input.value.trim(); close(dialog); if (v) onRename(v); }\n      }, \"Guardar\"),\n      el(\"button\", { type: \"button\", class: \"btn quiet\", onClick: () => close(dialog) }, \"Cancelar\")\n    )\n  );\n  return openDialog(dialog);\n}\n\n/** Explore Apply: exactly three actions, no silent mutation. */\nexport function applyExploreDialog({ onSaveNew, onOverwrite, fromDemo }) {\n  const dialog = el(\"dialog\", { \"aria-label\": \"Aplicar al perfil\" },\n    el(\"h3\", { text: \"Apply to profile\" }),\n    el(\"p\", { class: \"small\", text: fromDemo\n      ? \"Explore empezó desde un perfil de demostración: sobrescribir crea una copia propia y deja la demo intacta.\"\n      : \"Los cambios de Explore todavía no tocaron el perfil real.\" }),\n    el(\"div\", { class: \"dialog-actions\" },\n      el(\"button\", { type: \"button\", class: \"btn accent\", onClick: () => { close(dialog); onSaveNew(); } }, \"Save as new profile\"),\n      el(\"button\", { type: \"button\", class: \"btn\", onClick: () => { close(dialog); onOverwrite(); } }, \"Overwrite current profile\"),\n      el(\"button\", { type: \"button\", class: \"btn quiet\", onClick: () => close(dialog) }, \"Cancel\")\n    )\n  );\n  return openDialog(dialog);\n}\n","js/ui/fit-components.js":"import { el, details, canonicalLink } from \"lmb:js/ui/dom.js\";\nimport { fitText } from \"lmb:js/domain/markdown.js\";\nimport { hardwareFitRemedies } from \"lmb:js/domain/hardware-fit.js\";\nimport { provenanceLabel } from \"lmb:js/domain/provenance.js\";\n\nconst TONE = {\n  comfortable: \"is-good\", good: \"is-good\",\n  tight: \"is-mid\", stretch: \"is-mid\", tradeoffs: \"is-mid\",\n  not_viable: \"is-bad\", wrong: \"is-bad\", poor: \"is-bad\",\n  unknown: \"is-unknown\"\n};\n\nconst ICON = {\n  comfortable: \"✓\", good: \"✓\",\n  tight: \"⚠\", stretch: \"⚠\", tradeoffs: \"⚠\",\n  not_viable: \"✕\", wrong: \"✕\", poor: \"✕\",\n  unknown: \"○\"\n};\n\n/** Icon + text is the primary signal; colour is secondary reinforcement only. */\nexport function fitRow(label, fit) {\n  const status = (fit && fit.status) || \"unknown\";\n  return el(\"div\", { class: `fit ${TONE[status] || \"is-unknown\"}` },\n    el(\"span\", { class: \"fit-icon\", \"aria-hidden\": \"true\", text: ICON[status] || \"○\" }),\n    el(\"span\", { class: \"fit-label\", text: `${label}:` }),\n    el(\"span\", { class: \"fit-value\", text: fitText(status) })\n  );\n}\n\nexport function reasonsList(fit) {\n  const reasons = (fit && fit.reasons) || [];\n  if (!reasons.length) return null;\n  return el(\"ul\", { class: \"fit-reasons\" }, reasons.map(r => el(\"li\", { text: r })));\n}\n\nexport function provenanceBadge(key, extra) {\n  if (!key) return null;\n  return el(\"span\", { class: \"badge\", title: extra || \"\" }, provenanceLabel(key));\n}\n\nexport function pendingBadge(verifiedAt) {\n  if (verifiedAt) return el(\"span\", { class: \"badge\", text: `Verificado ${verifiedAt}` });\n  return el(\"span\", { class: \"badge pending\", text: \"Pendiente de verificación\" });\n}\n\nexport function fitTriple(derivedLike) {\n  return el(\"div\", { class: \"cc-fits\" },\n    fitRow(\"Ajuste de hardware / Hardware Fit\", derivedLike.hardwareFit),\n    fitRow(\"Ajuste de tarea / Task Fit\", derivedLike.taskFit),\n    fitRow(\"Ajuste operativo / Operational Fit\", derivedLike.operationalFit)\n  );\n}\n\nexport function fitDetails(derivedLike, model) {\n  const est = derivedLike.hardwareFit && derivedLike.hardwareFit.estimate;\n  const remedies = hardwareFitRemedies(derivedLike.hardwareFit);\n  return details(\"Detalles\",\n    reasonsList(derivedLike.hardwareFit),\n    reasonsList(derivedLike.taskFit),\n    reasonsList(derivedLike.operationalFit),\n    est ? el(\"dl\", { class: \"kv dc-stack\" },\n      el(\"dt\", { text: \"Memoria mínima estimada\" }), el(\"dd\", { text: `~${est.minRequiredGB} GB` }),\n      el(\"dt\", { text: \"Memoria cómoda estimada\" }), el(\"dd\", { text: `~${est.comfortableRequiredGB} GB` }),\n      el(\"dt\", { text: \"Almacenamiento necesario\" }), el(\"dd\", { text: `~${est.storageRequiredGB} GB` }),\n      el(\"dt\", { text: \"Reserva por contexto\" }), el(\"dd\", { text: `~${est.contextExtraGB} GB con ${est.contextTokens} tokens` })\n    ) : null,\n    model ? el(\"dl\", { class: \"kv dc-stack\" },\n      el(\"dt\", { text: \"Publisher\" }), el(\"dd\", { text: model.publisher }),\n      el(\"dt\", { text: \"Parámetros\" }), el(\"dd\", { text: model.parameters }),\n      el(\"dt\", { text: \"Formato\" }), el(\"dd\", { text: model.format }),\n      el(\"dt\", { text: \"Fuente canónica\" }), el(\"dd\", null, canonicalLink(model.canonicalSource) || \"—\")\n    ) : null,\n    remedies.length ? el(\"div\", null,\n      el(\"h4\", { text: \"¿Qué tendría que cambiar?\" }),\n      el(\"ul\", null, remedies.map(r => el(\"li\", { text: r })))\n    ) : null,\n    el(\"div\", { class: \"row\" },\n      provenanceBadge(\"DERIVED_ESTIMATE\", \"Estimación del Bench, no medición del equipo\"),\n      provenanceBadge(\"COMPATIBILITY_MAP\", \"Task Fit viene del mapa de compatibilidad del workshop\"),\n      model ? pendingBadge(model.verifiedAt) : null\n    )\n  );\n}\n\nexport function candidateCard(candidate, model, options) {\n  const opts = options || {};\n  return el(\"article\", { class: `card candidate-card${opts.selected ? \" is-selected\" : \"\"}` },\n    el(\"div\", { class: \"cc-model\", text: candidate.family }),\n    el(\"div\", { class: \"cc-meta\", text: `${candidate.quantization || \"—\"} · ${candidate.contextTokens || \"—\"} tokens de contexto` }),\n    fitTriple(candidate),\n    el(\"p\", { class: \"cc-tradeoff\", text: candidate.tradeoff }),\n    fitDetails(candidate, model),\n    opts.onSelect\n      ? el(\"div\", { class: \"cc-select\" },\n          el(\"button\", {\n            type: \"button\",\n            class: `btn ${opts.selected ? \"\" : \"accent\"}`.trim(),\n            onClick: () => opts.onSelect(candidate.modelId)\n          }, opts.selected ? \"Modelo elegido ✓\" : \"Elegir este modelo\"))\n      : null\n  );\n}\n","js/domain/markdown.js":"import { buildRoutingPressures, routingFingerprint } from \"lmb:js/domain/routing-pressures.js\";\nimport { provenanceLabel, dataCheckedLabel } from \"lmb:js/domain/provenance.js\";\nimport { EVALUATION_GROUPS } from \"lmb:js/domain/benchmark-evaluator.js\";\n\nexport const MISSING = \"No completado\";\n\nconst FIT_TEXT = {\n  comfortable: \"✓ Cómodo / Comfortable\",\n  tight: \"⚠ Al borde / Tight\",\n  not_viable: \"✕ No viable\",\n  good: \"✓ Buen ajuste / Good fit\",\n  stretch: \"⚠ Al límite / Stretch\",\n  wrong: \"✕ Herramienta equivocada / Wrong tool\",\n  tradeoffs: \"⚠ Con concesiones / Tradeoffs\",\n  poor: \"✕ Poco sentido operativo\",\n  unknown: \"○ Sin datos\"\n};\n\nexport function fitText(status) {\n  return FIT_TEXT[status] || MISSING;\n}\n\nfunction optionLabel(taskOptions, listKey, id) {\n  if (id === null || id === undefined || id === \"\") return null;\n  const list = taskOptions && taskOptions[listKey];\n  if (Array.isArray(list)) {\n    const found = list.find(x => x && x.id === id);\n    if (found) return found.label;\n  }\n  const maps = {\n    languages: \"languageLabels\",\n    privacy: \"privacyLabels\",\n    errorCost: \"errorCostLabels\",\n    materialLength: \"materialLengthLabels\",\n    graphicsTypes: \"graphicsLabels\"\n  };\n  const mapKey = maps[listKey];\n  if (mapKey && taskOptions && taskOptions[mapKey] && taskOptions[mapKey][id]) return taskOptions[mapKey][id];\n  return String(id);\n}\n\nfunction entry(label, value, provenance) {\n  const empty = value === null || value === undefined || value === \"\";\n  return { label, value: empty ? null : value, provenance: provenance || null, missing: empty };\n}\n\n/**\n * One read-only interpretation of profile state, consumed by both the Plan screen and Markdown export.\n */\nexport function buildPlanViewModel(profile, derived, datasets, session, options = {}) {\n  const taskOptions = datasets.taskOptions || {};\n  const models = datasets.models || [];\n  const model = models.find(m => m.id === profile.selection.selectedModelId) || null;\n  const pressures = buildRoutingPressures(profile, derived || {});\n  const fingerprint = routingFingerprint(profile, derived || {});\n\n  const blocks = [\n    {\n      id: \"use\",\n      title: \"Tarea / Use\",\n      entries: [\n        entry(\"Familia de tarea\", optionLabel(taskOptions, \"taskFamilies\", profile.use.taskFamily), \"USER_INPUT\"),\n        entry(\"Dinámica de interacción\", optionLabel(taskOptions, \"interactionDynamics\", profile.use.interactionDynamic), \"USER_INPUT\"),\n        entry(\"Idioma de trabajo\", optionLabel(taskOptions, \"languages\", profile.use.language), \"USER_INPUT\"),\n        entry(\"Privacidad\", optionLabel(taskOptions, \"privacy\", profile.use.privacy), \"USER_INPUT\"),\n        entry(\"Necesita web actual\", profile.use.currentWeb === null ? null : (profile.use.currentWeb ? \"Sí\" : \"No\"), \"USER_INPUT\"),\n        entry(\"Costo del error\", optionLabel(taskOptions, \"errorCost\", profile.use.errorCost), \"USER_INPUT\"),\n        entry(\"Largo del material\", optionLabel(taskOptions, \"materialLength\", profile.use.materialLength), \"USER_INPUT\")\n      ]\n    },\n    {\n      id: \"hardware\",\n      title: \"Hardware\",\n      entries: [\n        entry(\"Sistema operativo\", profile.hardware.os, \"USER_INPUT\"),\n        entry(\"RAM\", profile.hardware.ramGB ? `${profile.hardware.ramGB} GB` : null, \"USER_INPUT\"),\n        entry(\"Gráficos\", optionLabel(taskOptions, \"graphicsTypes\", profile.hardware.graphicsType), \"USER_INPUT\"),\n        entry(\"VRAM\", profile.hardware.vramGB ? `${profile.hardware.vramGB} GB` : null, \"USER_INPUT\"),\n        entry(\"Memoria unificada\", profile.hardware.unifiedMemoryGB ? `${profile.hardware.unifiedMemoryGB} GB` : null, \"USER_INPUT\"),\n        entry(\"Almacenamiento libre\", profile.hardware.storageFreeGB ? `${profile.hardware.storageFreeGB} GB` : null, \"USER_INPUT\")\n      ],\n      notes: [\"Este es un sobre de capacidad, no una garantía.\"]\n    },\n    {\n      id: \"selection\",\n      title: \"Modelo elegido / Selected model\",\n      entries: [\n        entry(\"Modelo\", model ? `${model.family} (${model.publisher}, ${model.parameters})` : null, \"PUBLISHER_CLAIM_VIA_HF\"),\n        entry(\"Formato\", model ? model.format : null, \"PUBLISHER_CLAIM_VIA_HF\"),\n        entry(\"Cuantización\", profile.selection.quantization, \"USER_INPUT\"),\n        entry(\"Cuantización recomendada\", derived && derived.recommendedQuantization, \"DERIVED_ESTIMATE\"),\n        entry(\"Contexto\", profile.selection.contextTokens ? `${profile.selection.contextTokens} tokens` : null, \"USER_INPUT\"),\n        entry(\"Contexto recomendado\", derived && derived.recommendedContextTokens ? `${derived.recommendedContextTokens} tokens` : null, \"DERIVED_ESTIMATE\")\n      ]\n    },\n    {\n      id: \"fits\",\n      title: \"Ajustes / Fit\",\n      entries: [\n        entry(\"Hardware Fit\", derived && derived.hardwareFit ? fitText(derived.hardwareFit.status) : null, \"DERIVED_ESTIMATE\"),\n        entry(\"Task Fit\", derived && derived.taskFit ? fitText(derived.taskFit.status) : null, \"COMPATIBILITY_MAP\"),\n        entry(\"Operational Fit\", derived && derived.operationalFit ? fitText(derived.operationalFit.status) : null, \"DERIVED_ESTIMATE\")\n      ],\n      reasons: [\n        ...((derived && derived.hardwareFit && derived.hardwareFit.reasons) || []),\n        ...((derived && derived.taskFit && derived.taskFit.reasons) || []),\n        ...((derived && derived.operationalFit && derived.operationalFit.reasons) || [])\n      ],\n      warnings: (derived && derived.warnings) || []\n    }\n  ];\n\n  const candidates = ((derived && derived.candidates) || []).map(c => ({\n    family: c.family,\n    quantization: c.quantization,\n    contextTokens: c.contextTokens,\n    hardwareFit: fitText(c.hardwareFit.status),\n    taskFit: fitText(c.taskFit.status),\n    operationalFit: fitText(c.operationalFit.status),\n    tradeoff: c.tradeoff\n  }));\n\n  const runs = ((profile.runCard && profile.runCard.runs) || []).map((run, index) => ({\n    number: index + 1,\n    id: run.id,\n    createdAt: run.createdAt,\n    benchmarkVersion: run.benchmarkVersion,\n    modelId: run.modelId,\n    quantization: run.quantization,\n    contextTokens: run.contextTokens,\n    runner: run.runner,\n    generationTimeSeconds: run.generationTimeSeconds,\n    tokensPerSecond: run.tokensPerSecond,\n    ttftSeconds: run.ttftSeconds,\n    evaluation: run.evaluation,\n    observations: run.observations,\n    response: session ? session.getBenchmarkResponse(run.id) : null\n  }));\n\n  const incomplete = [];\n  for (const block of blocks) {\n    for (const e of block.entries) if (e.missing) incomplete.push(`${block.title} — ${e.label}`);\n  }\n  if (!runs.length) incomplete.push(\"Run Card — sin corridas registradas\");\n  if (!profile.routing.choice) incomplete.push(\"Local / Cloud / Hybrid — sin decisión\");\n\n  return {\n    profileName: profile.name,\n    profileId: profile.id,\n    exportedAt: options.now || new Date().toISOString(),\n    dataVersion: (datasets.version && datasets.version.dataVersion) || null,\n    dataCheckedLabel: dataCheckedLabel(datasets.version),\n    benchmarkVersion: (datasets.benchmark && datasets.benchmark.version) || null,\n    blocks,\n    candidates,\n    runs,\n    routing: {\n      choice: profile.routing.choice,\n      recordedFingerprint: profile.routing.decisionFingerprint,\n      currentFingerprint: fingerprint,\n      inputsChanged: Boolean(profile.routing.choice && profile.routing.decisionFingerprint && profile.routing.decisionFingerprint !== fingerprint),\n      pressures\n    },\n    incomplete\n  };\n}\n\nfunction valueOrMissing(e) {\n  return e.missing ? MISSING : e.value;\n}\n\nexport function buildMarkdown(viewModel) {\n  const L = [];\n  L.push(`# My Local Model Plan — ${viewModel.profileName}`);\n  L.push(\"\");\n  L.push(`_Uso de Modelos Locales · The Multiverse School_`);\n  L.push(\"\");\n  L.push(`- Perfil: ${viewModel.profileName}`);\n  L.push(`- Exportado: ${viewModel.exportedAt}`);\n  L.push(`- Versión de datos: ${viewModel.dataVersion || MISSING}`);\n  L.push(`- ${viewModel.dataCheckedLabel}`);\n  L.push(`- Fixture de prueba: ${viewModel.benchmarkVersion || MISSING}`);\n  L.push(\"\");\n\n  for (const block of viewModel.blocks) {\n    L.push(`## ${block.title}`);\n    L.push(\"\");\n    for (const e of block.entries) {\n      L.push(`- **${e.label}:** ${valueOrMissing(e)}${e.provenance && !e.missing ? `  _(${provenanceLabel(e.provenance)})_` : \"\"}`);\n    }\n    if (block.reasons && block.reasons.length) {\n      L.push(\"\");\n      L.push(\"Razonamiento derivado:\");\n      for (const r of block.reasons) L.push(`- ${r}`);\n    }\n    if (block.warnings && block.warnings.length) {\n      L.push(\"\");\n      L.push(\"Advertencias:\");\n      for (const w of block.warnings) L.push(`- ${w}`);\n    }\n    if (block.notes && block.notes.length) {\n      L.push(\"\");\n      for (const n of block.notes) L.push(`> ${n}`);\n    }\n    L.push(\"\");\n  }\n\n  L.push(\"## Candidatos considerados\");\n  L.push(\"\");\n  if (!viewModel.candidates.length) {\n    L.push(`- ${MISSING}`);\n  } else {\n    for (const c of viewModel.candidates) {\n      L.push(`- **${c.family}** — ${c.quantization || MISSING} · ${c.contextTokens || MISSING} tokens`);\n      L.push(`  - Hardware Fit: ${c.hardwareFit}`);\n      L.push(`  - Task Fit: ${c.taskFit}`);\n      L.push(`  - Operational Fit: ${c.operationalFit}`);\n      L.push(`  - Concesión principal: ${c.tradeoff}`);\n    }\n  }\n  L.push(\"\");\n\n  L.push(\"## Run Card\");\n  L.push(\"\");\n  if (!viewModel.runs.length) {\n    L.push(`- ${MISSING}`);\n    L.push(\"\");\n  } else {\n    for (const run of viewModel.runs) {\n      L.push(`### Corrida ${run.number}`);\n      L.push(\"\");\n      L.push(`- Fecha: ${run.createdAt || MISSING}`);\n      L.push(`- Modelo: ${run.modelId || MISSING}`);\n      L.push(`- Cuantización: ${run.quantization || MISSING}`);\n      L.push(`- Contexto: ${run.contextTokens ? `${run.contextTokens} tokens` : MISSING}`);\n      L.push(`- Runner: ${run.runner || MISSING}`);\n      L.push(`- Fixture: ${run.benchmarkVersion || MISSING}`);\n      L.push(`- Tiempo total de generación: ${run.generationTimeSeconds !== null && run.generationTimeSeconds !== undefined ? `${run.generationTimeSeconds} s` : MISSING}`);\n      L.push(`- Tokens/seg: ${run.tokensPerSecond ?? MISSING}`);\n      L.push(`- TTFT: ${run.ttftSeconds ?? MISSING}`);\n      L.push(\"\");\n      L.push(\"**Calidad observada (evaluación determinista)**\");\n      L.push(\"\");\n      if (!run.evaluation) {\n        L.push(`- ${MISSING}`);\n      } else {\n        for (const group of EVALUATION_GROUPS) {\n          L.push(`- ${group.label}: ${run.evaluation[group.id] || MISSING}`);\n        }\n        if (Array.isArray(run.evaluation.details)) {\n          for (const d of run.evaluation.details) L.push(`  - [${d.status}] ${d.message}`);\n        }\n      }\n      L.push(\"\");\n      if (run.observations) {\n        L.push(`**Observaciones:** ${run.observations}`);\n        L.push(\"\");\n      }\n      if (run.response) {\n        L.push(\"**Respuesta completa del modelo** (presente sólo en esta sesión):\");\n        L.push(\"\");\n        L.push(\"```text\");\n        L.push(run.response);\n        L.push(\"```\");\n        L.push(\"\");\n      } else {\n        L.push(\"_La respuesta completa no está en memoria: sólo se conserva la evaluación estructurada y el rendimiento._\");\n        L.push(\"\");\n      }\n    }\n  }\n\n  L.push(\"## Local / Cloud / Hybrid\");\n  L.push(\"\");\n  L.push(`- Decisión: ${viewModel.routing.choice ? viewModel.routing.choice : MISSING}`);\n  if (viewModel.routing.inputsChanged) {\n    L.push(\"- Aviso: los datos cambiaron después de tomar esta decisión.\");\n  }\n  L.push(\"\");\n  L.push(\"Presiones visibles:\");\n  for (const p of viewModel.routing.pressures) {\n    L.push(`- (${p.toward}, ${p.strength}) **${p.label}** — ${p.reason} _(${provenanceLabel(p.provenance)})_`);\n  }\n  L.push(\"\");\n\n  L.push(\"## Secciones incompletas\");\n  L.push(\"\");\n  if (!viewModel.incomplete.length) {\n    L.push(\"- Ninguna.\");\n  } else {\n    for (const item of viewModel.incomplete) L.push(`- ${item}: ${MISSING}`);\n  }\n  L.push(\"\");\n  L.push(\"---\");\n  L.push(\"\");\n  L.push(\"Generado localmente por Local Model Bench v1. Sin servidor, sin cuenta, sin telemetría.\");\n  L.push(\"\");\n\n  return L.join(\"\\n\");\n}\n\nexport function planFilename(viewModel) {\n  const slug = String(viewModel.profileName || \"perfil\")\n    .normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g, \"\")\n    .toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-+|-+$/g, \"\").slice(0, 48) || \"perfil\";\n  return `local-model-plan-${slug}.md`;\n}\n","js/domain/routing-pressures.js":"/**\n * Routing pressures. Explains the field of forces; never returns a route.\n * The returned records deliberately contain no `recommendation`, `winner` or `choice` key.\n */\nexport function buildRoutingPressures(profile, derived) {\n  const use = profile.use || {};\n  const out = [];\n  const push = (id, toward, strength, label, reason, provenance) =>\n    out.push({ id, toward, strength, label, reason, provenance });\n\n  if (use.privacy === \"must_stay_local\") {\n    push(\"privacy-local\", \"local\", \"strong\", \"El material no puede salir del equipo\",\n      \"La restricción de privacidad declarada empuja el trabajo hacia ejecución local.\", \"USER_INPUT\");\n  } else if (use.privacy === \"sensitive\") {\n    push(\"privacy-sensitive\", \"local\", \"notable\", \"Material sensible\",\n      \"Material sensible declarado: conviene revisar qué sale del equipo.\", \"USER_INPUT\");\n  }\n\n  if (use.currentWeb === true) {\n    push(\"web-current\", \"cloud\", \"strong\", \"Necesita información actual de la web\",\n      \"Un modelo local por sí solo no aporta información actual externa.\", \"USER_INPUT\");\n  }\n\n  const hf = derived && derived.hardwareFit;\n  if (hf && hf.status === \"not_viable\") {\n    push(\"hardware-not-viable\", \"cloud\", \"strong\", \"Hardware no viable\",\n      \"La combinación elegida no entra en el equipo declarado.\", \"DERIVED_ESTIMATE\");\n  } else if (hf && hf.status === \"tight\") {\n    push(\"hardware-tight\", \"hybrid\", \"notable\", \"Hardware al borde\",\n      \"Entra sin holgura: sirve para trabajo puntual, no para carga sostenida.\", \"DERIVED_ESTIMATE\");\n  } else if (hf && hf.status === \"comfortable\") {\n    push(\"hardware-comfortable\", \"local\", \"notable\", \"Hardware cómodo\",\n      \"Hay holgura de memoria con la cuantización y el contexto actuales.\", \"DERIVED_ESTIMATE\");\n  }\n\n  const tf = derived && derived.taskFit;\n  if (tf && tf.status === \"wrong\") {\n    push(\"task-wrong\", \"cloud\", \"strong\", \"Ajuste de tarea: herramienta equivocada\",\n      \"El mapa de compatibilidad marca esta combinación como inadecuada para la tarea.\", \"COMPATIBILITY_MAP\");\n  } else if (tf && tf.status === \"stretch\") {\n    push(\"task-stretch\", \"hybrid\", \"notable\", \"Ajuste de tarea al límite\",\n      \"Funciona con supervisión; conviene reservar la nube para los casos difíciles.\", \"COMPATIBILITY_MAP\");\n  } else if (tf && tf.status === \"good\") {\n    push(\"task-good\", \"local\", \"notable\", \"Ajuste de tarea bueno\",\n      \"El modelo elegido es adecuado para la tarea y la dinámica declaradas.\", \"COMPATIBILITY_MAP\");\n  }\n\n  const ctx = derived && derived.effectiveContextTokens;\n  if (use.materialLength === \"long\" && Number(ctx) > 0 && Number(ctx) \u003c 16384) {\n    push(\"context-short\", \"hybrid\", \"notable\", \"Material largo con contexto reducido\",\n      `El contexto operativo es de ${ctx} tokens y el material declarado es largo.`, \"DERIVED_ESTIMATE\");\n  }\n\n  if (use.errorCost === \"high\") {\n    push(\"error-cost\", \"hybrid\", \"notable\", \"Costo de error alto\",\n      \"Con costo de error alto, la revisión humana o una segunda opinión en la nube pesan más.\", \"USER_INPUT\");\n  }\n\n  const runs = (profile.runCard && profile.runCard.runs) || [];\n  for (const run of runs) {\n    if (Number(run.generationTimeSeconds) > 0) {\n      push(`observed-${run.id}`, \"neutral\", \"notable\", \"Rendimiento observado\",\n        `Corrida registrada: ${run.generationTimeSeconds} s totales en ${run.runner || \"runner sin nombre\"}.`, \"WORKSHOP_TESTED\");\n    }\n    if (run.evaluation && run.evaluation.unsupported === \"fail\") {\n      push(`quality-${run.id}`, \"hybrid\", \"notable\", \"Afirmaciones sin respaldo en la prueba\",\n        \"La evaluación determinista detectó una afirmación prohibida en la salida registrada.\", \"WORKSHOP_TESTED\");\n    }\n  }\n\n  if (!out.length) {\n    push(\"no-pressures\", \"neutral\", \"notable\", \"Sin presiones registradas\",\n      \"Faltan datos para mostrar presiones: completar tarea, hardware y modelo elegido.\", \"USER_INPUT\");\n  }\n\n  return out;\n}\n\n/** Deterministic fingerprint of the inputs a routing decision was made against. */\nexport function routingFingerprint(profile, derived) {\n  const parts = [\n    profile.use.taskFamily, profile.use.interactionDynamic, profile.use.privacy,\n    String(profile.use.currentWeb), profile.use.errorCost, profile.use.materialLength,\n    profile.selection.selectedModelId, profile.selection.quantization, String(profile.selection.contextTokens),\n    derived && derived.hardwareFit ? derived.hardwareFit.status : \"null\",\n    derived && derived.taskFit ? derived.taskFit.status : \"null\",\n    derived && derived.operationalFit ? derived.operationalFit.status : \"null\"\n  ];\n  return parts.map(p => (p === null || p === undefined ? \"-\" : String(p))).join(\"|\");\n}\n\nexport const ROUTE_CHOICES = Object.freeze([\n  { id: \"local\", label: \"Local\" },\n  { id: \"cloud\", label: \"Cloud\" },\n  { id: \"hybrid\", label: \"Hybrid\" }\n]);\n","js/domain/benchmark-evaluator.js":"/**\n * Deterministic evaluator for the fixed faro-v1 fixture.\n * Only observable properties of the pasted text. No semantic judgement, no LLM.\n */\n\nconst MONTHS = \"enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre\";\n\nfunction norm(text) {\n  return String(text ?? \"\")\n    .replace(/\\u00a0/g, \" \")\n    .normalize(\"NFD\")\n    .replace(/[\\u0300-\\u036f]/g, \"\")\n    .toLowerCase();\n}\n\nfunction digitsOf(text) {\n  return norm(text).replace(/(\\d)[.,\\s](?=\\d)/g, \"$1\");\n}\n\nfunction labelLines(text, labels) {\n  const lines = String(text ?? \"\").split(/\\r?\\n/);\n  const found = {};\n  const order = [];\n  labels.forEach(label => {\n    const key = norm(label);\n    for (let i = 0; i \u003c lines.length; i += 1) {\n      const line = norm(lines[i]).trimStart();\n      if (line.startsWith(key + \":\") || line.startsWith(\"**\" + key + \":\") || line.startsWith(key + \" :\")) {\n        if (!(label in found)) {\n          found[label] = { index: i, text: lines[i] };\n          order.push(label);\n        }\n        break;\n      }\n    }\n  });\n  return { found, order, lines };\n}\n\nfunction groupStatus(checks, mode) {\n  const passed = checks.filter(c => c.status === \"pass\").length;\n  if (mode === \"forbidden\") return passed === checks.length ? \"pass\" : \"fail\";\n  if (passed === checks.length) return \"pass\";\n  if (mode === \"format\") return passed >= 1 ? \"partial\" : \"fail\";\n  if (passed === 0) return \"fail\";\n  if (checks.length >= 4 && passed \u003c= 1) return \"fail\";\n  return \"partial\";\n}\n\nexport function evaluateBenchmark(response, fixture) {\n  const raw = String(response ?? \"\");\n  const labels = (fixture && fixture.labels) || [];\n  const text = norm(raw);\n  const digits = digitsOf(raw);\n  const { found, order } = labelLines(raw, labels);\n\n  const line = (label) => (found[label] ? norm(found[label].text) : \"\");\n  const lineDigits = (label) => (found[label] ? digitsOf(found[label].text) : \"\");\n\n  const details = [];\n  const add = (id, group, status, message) => { details.push({ id, group, status, message }); };\n\n  // ---- format -------------------------------------------------------------\n  const allLabels = labels.every(l => l in found);\n  add(\"format_labels\", \"format\", allLabels ? \"pass\" : \"fail\",\n    allLabels ? \"Las seis etiquetas están presentes.\" : `Faltan etiquetas: ${labels.filter(l => !(l in found)).join(\", \") || \"—\"}.`);\n\n  const indices = order.map(l => found[l].index);\n  const inOrder = order.length === labels.length &&\n    order.every((l, i) => l === labels[i]) &&\n    indices.every((v, i) => i === 0 || v > indices[i - 1]);\n  add(\"format_order\", \"format\", inOrder ? \"pass\" : \"fail\",\n    inOrder ? \"Las etiquetas aparecen en el orden pedido.\" : \"El orden de las etiquetas no coincide con el pedido.\");\n\n  // ---- factual ------------------------------------------------------------\n  const hasNewDate = /\\b14\\s*(de\\s*)?(octubre|oct\\b|\\/\\s*10|-\\s*10)/.test(text) || /\\b14[/-]10\\b/.test(digits);\n  add(\"fact_date\", \"factual\", hasNewDate ? \"pass\" : \"fail\",\n    hasNewDate ? \"Reporta el 14 de octubre.\" : \"No reporta el 14 de octubre como fecha vigente.\");\n\n  const hasNewBudget = /18500/.test(digits);\n  add(\"fact_budget\", \"factual\", hasNewBudget ? \"pass\" : \"fail\",\n    hasNewBudget ? \"Reporta US$18.500.\" : \"No reporta US$18.500 como presupuesto vigente.\");\n\n  const purchasingScope = found[\"COMPRAS\"] ? line(\"COMPRAS\") : text;\n  const hasOwner = /camila/.test(purchasingScope);\n  add(\"fact_purchasing\", \"factual\", hasOwner ? \"pass\" : \"fail\",\n    hasOwner ? \"Identifica a Camila Rojas en compras.\" : \"No identifica a Camila Rojas como responsable de compras.\");\n\n  const siteScope = found[\"SEDES\"] ? line(\"SEDES\") : text;\n  const sites = [\"norte\", \"centro\", \"sur\"].filter(s => siteScope.includes(s));\n  add(\"fact_sites\", \"factual\", sites.length === 3 ? \"pass\" : \"fail\",\n    sites.length === 3 ? \"Nombra las tres sedes.\" : `Sólo nombra: ${sites.join(\", \") || \"ninguna\"}.`);\n\n  // ---- omission -----------------------------------------------------------\n  const surUnconfirmed = /(sin confirmar|no ha confirmado|no confirmo|no confirmada|pendiente de confirm|falta confirm|sin confirmacion)/.test(siteScope);\n  add(\"omission_sur\", \"omission\", surUnconfirmed ? \"pass\" : \"fail\",\n    surUnconfirmed ? \"Marca que Sur sigue sin confirmar.\" : \"No marca que Sur sigue sin confirmar.\");\n\n  const dataScope = found[\"DATOS\"] ? line(\"DATOS\") : text;\n  const dataRule = /(no puede salir|ningun dato|no pueden salir|no salir del equipo|dentro del equipo|no compartir)/.test(dataScope);\n  add(\"omission_data\", \"omission\", dataRule ? \"pass\" : \"fail\",\n    dataRule ? \"Recoge la restricción sobre datos de clientes.\" : \"No recoge la restricción sobre datos de clientes.\");\n\n  const contraScope = found[\"CONTRADICCIÓN\"] ? line(\"CONTRADICCIÓN\") : text;\n  const contraDigits = found[\"CONTRADICCIÓN\"] ? lineDigits(\"CONTRADICCIÓN\") : digits;\n  const contraFound = /\\b4\\s*(de\\s*)?octubre/.test(contraScope) || /21000/.test(contraDigits);\n  add(\"omission_contradiction\", \"omission\", contraFound ? \"pass\" : \"fail\",\n    contraFound ? \"Identifica un dato anterior reemplazado.\" : \"No identifica el dato anterior que quedó reemplazado.\");\n\n  // ---- unsupported (fixture-specific forbidden claims) --------------------\n  const dateScope = found[\"FECHA\"] ? line(\"FECHA\") : text;\n  const oldDateAsCurrent = /\\b4\\s*(de\\s*)?octubre/.test(dateScope) && !/\\b14\\s*(de\\s*)?octubre/.test(dateScope);\n  add(\"unsupported_old_date\", \"unsupported\", oldDateAsCurrent ? \"fail\" : \"pass\",\n    oldDateAsCurrent ? \"Presenta el 4 de octubre como fecha vigente.\" : \"No presenta la fecha reemplazada como vigente.\");\n\n  const budgetScope = found[\"PRESUPUESTO\"] ? lineDigits(\"PRESUPUESTO\") : digits;\n  const oldBudgetAsCurrent = /21000/.test(budgetScope) && !/18500/.test(budgetScope);\n  add(\"unsupported_old_budget\", \"unsupported\", oldBudgetAsCurrent ? \"fail\" : \"pass\",\n    oldBudgetAsCurrent ? \"Presenta US$21.000 como presupuesto vigente.\" : \"No presenta el presupuesto reemplazado como vigente.\");\n\n  const wrongOwner = /tomas/.test(purchasingScope) && !/camila/.test(purchasingScope);\n  add(\"unsupported_wrong_owner\", \"unsupported\", wrongOwner ? \"fail\" : \"pass\",\n    wrongOwner ? \"Asigna compras a Tomás Vega.\" : \"No asigna compras a Tomás Vega.\");\n\n  const surDatePattern = new RegExp(`sur[^\\\\n]{0,60}?(\\\\b\\\\d{1,2}\\\\s*(de\\\\s*)?(${MONTHS})\\\\b|\\\\b\\\\d{1,2}[/-]\\\\d{1,2}\\\\b)`);\n  const inventedSurDate = surDatePattern.test(siteScope);\n  add(\"unsupported_invented_sur_date\", \"unsupported\", inventedSurDate ? \"fail\" : \"pass\",\n    inventedSurDate ? \"Inventa una fecha asociada a Sur.\" : \"No inventa una fecha para Sur.\");\n\n  const byGroup = (g) => details.filter(d => d.group === g);\n\n  return {\n    fixtureVersion: (fixture && fixture.version) || null,\n    format: groupStatus(byGroup(\"format\"), \"format\"),\n    factual: groupStatus(byGroup(\"factual\")),\n    omission: groupStatus(byGroup(\"omission\")),\n    unsupported: groupStatus(byGroup(\"unsupported\"), \"forbidden\"),\n    details,\n    notes: [\n      \"Sólo se miden propiedades observables del texto pegado.\",\n      \"`unsupported` cubre únicamente las afirmaciones prohibidas de este fixture; no detecta toda alucinación.\"\n    ]\n  };\n}\n\nexport const EVALUATION_GROUPS = Object.freeze([\n  { id: \"format\", label: \"Instrucción seguida (formato)\" },\n  { id: \"factual\", label: \"Datos clave recuperados\" },\n  { id: \"omission\", label: \"Distinciones y contradicción\" },\n  { id: \"unsupported\", label: \"Afirmaciones sin respaldo\" }\n]);\n","js/ui/landing.js":"import { el } from \"lmb:js/ui/dom.js\";\nimport { dataCheckedLabel, offlineDataNote } from \"lmb:js/domain/provenance.js\";\n\nexport function renderLanding(ctx) {\n  const version = ctx.datasets.version;\n  const profiles = ctx.store.listProfiles();\n\n  return el(\"main\", { class: \"landing\", id: \"main\" },\n    el(\"p\", { class: \"eyebrow small muted\", text: \"Uso de Modelos Locales · The Multiverse School\" }),\n    el(\"h1\", { text: \"Local Model Bench\" }),\n    el(\"p\", { class: \"lede\" },\n      \"Un banco de trabajo para decidir qué modelo local usar: qué quieres hacer, qué aguanta tu equipo, cómo leer un modelo, cómo probarlo y si esa tarea conviene local, en la nube o híbrida.\"),\n    el(\"div\", { class: \"entries\" },\n      entry(\"Start Workshop\", \"Crea un perfil vacío y entra en la ruta recomendada. Sin asistente ni pasos obligatorios.\",\n        () => ctx.startWorkshop()),\n      entry(\"My Profiles\", profiles.length\n        ? `${profiles.length} perfil(es) guardado(s) en este navegador.`\n        : \"Todavía no hay perfiles guardados en este navegador.\",\n        () => ctx.navigate(\"#/profiles\")),\n      entry(\"Demo Profiles\", \"Escenarios de solo lectura para facilitar sin inventar hardware en vivo.\",\n        () => ctx.navigate(\"#/demos\"))\n    ),\n    el(\"p\", { class: \"small muted\" },\n      \"La navegación es libre desde el principio: el orden es una recomendación pedagógica, no un candado.\"),\n    el(\"div\", { class: \"row small\" },\n      el(\"a\", { href: \"#/reference\", text: \"Referencia\" }),\n      el(\"a\", { href: \"#/sources\", text: \"Fuentes / Sources\" })\n    ),\n    el(\"p\", { class: \"small muted\", style: { marginTop: \"1.5rem\" } }, dataCheckedLabel(version)),\n    el(\"p\", { class: \"small muted\", text: offlineDataNote(version) })\n  );\n}\n\nfunction entry(title, desc, onClick) {\n  return el(\"button\", { type: \"button\", class: \"entry\", onClick },\n    el(\"span\", { class: \"e-title\", text: title }),\n    el(\"span\", { class: \"e-desc\", text: desc })\n  );\n}\n","js/ui/profiles.js":"import { el, sectionHead, card, notice } from \"lmb:js/ui/dom.js\";\nimport { confirmDialog, renameDialog } from \"lmb:js/ui/dialogs.js\";\nimport { computeCompletion, completionCount } from \"lmb:js/domain/completion.js\";\nimport { pendingBadge } from \"lmb:js/ui/fit-components.js\";\n\nexport function renderProfiles(ctx) {\n  const profiles = ctx.store.listProfiles();\n  const activeId = ctx.store.getActiveId();\n\n  return el(\"main\", { class: \"main\", id: \"main\" }, el(\"div\", { class: \"main-inner\" },\n    sectionHead(\"Perfiles\", \"My Profiles\", \"Cada perfil es un escenario independiente guardado en este navegador.\"),\n    profiles.length ? el(\"div\", { class: \"profile-list\" }, profiles.map(p => profileRow(ctx, p, p.id === activeId)))\n      : notice(\"info\", \"Todavía no hay perfiles. \", el(\"button\", {\n          type: \"button\", class: \"btn accent\", onClick: () => ctx.startWorkshop()\n        }, \"Start Workshop\")),\n    el(\"div\", { class: \"section-foot\" },\n      el(\"button\", { type: \"button\", class: \"btn accent\", onClick: () => ctx.startWorkshop() }, \"Nuevo perfil\"),\n      el(\"a\", { class: \"btn quiet\", href: \"#/\", text: \"Inicio\" })\n    )\n  ));\n}\n\nfunction profileRow(ctx, profile, isActive) {\n  const { done, total } = completionCount(computeCompletion(profile));\n  return el(\"div\", { class: `profile-row${isActive ? \" is-active\" : \"\"}` },\n    el(\"div\", null,\n      el(\"div\", { class: \"pr-name\", text: profile.name }),\n      el(\"div\", { class: \"pr-meta\", text: `${done}/${total} secciones · actualizado ${shortDate(profile.updatedAt)} · nombre ${profile.nameMode === \"manual\" ? \"manual\" : \"automático\"}` })\n    ),\n    el(\"div\", { class: \"row\" },\n      el(\"button\", { type: \"button\", class: \"btn accent\", onClick: () => { ctx.store.setActive(profile.id); ctx.exitDemo(); ctx.navigate(\"#/use\"); } },\n        isActive ? \"Continuar\" : \"Abrir\"),\n      el(\"button\", { type: \"button\", class: \"btn\", onClick: () => renameDialog(profile.name, name => { ctx.store.renameProfile(profile.id, name); ctx.rerender(); }) }, \"Renombrar\"),\n      el(\"button\", { type: \"button\", class: \"btn\", onClick: () => confirmDialog({\n        title: \"Vaciar este perfil\",\n        body: \"Se borran los datos del workshop de este perfil. El nombre manual se conserva.\",\n        confirmLabel: \"Vaciar\", danger: true\n      }, () => { ctx.store.clearProfile(profile.id); ctx.rerender(); }) }, \"Vaciar\"),\n      el(\"button\", { type: \"button\", class: \"btn danger\", onClick: () => confirmDialog({\n        title: \"Eliminar este perfil\",\n        body: \"Se elimina sólo este perfil. Los demás quedan intactos.\",\n        confirmLabel: \"Eliminar\", danger: true\n      }, () => { ctx.store.deleteProfile(profile.id); ctx.rerender(); }) }, \"Eliminar\")\n    )\n  );\n}\n\nexport function renderDemos(ctx) {\n  const demos = ctx.datasets.demos || [];\n  return el(\"main\", { class: \"main\", id: \"main\" }, el(\"div\", { class: \"main-inne <script>
(function () {

  globalThis.__LMB_ASSETS = JSON.parse(document.getElementById("lmb-assets").textContent);
  var SRC = JSON.parse(document.getElementById("lmb-modules").textContent);
  var built = Object.create(null), busy = Object.create(null);
  function build(id) {
    if (built[id]) return built[id];
    if (busy[id]) throw new Error("ciclo de modulos: " + id);
    busy[id] = true;
    var src = SRC[id];
    if (src === undefined) throw new Error("modulo ausente: " + id);
    src = src.replace(/(["'])lmb:([^"']+)\1/g, function (m, q, dep) { return q + build(dep) + q; });
    var url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    busy[id] = false;
    return (built[id] = url);
  }
  try {
    import(build("js/app.js")).catch(report);
  } catch (e) { report(e); }
  function report(e) {
    var p = document.createElement("p");
    p.style.cssText = "padding:16px;font:14px system-ui;color:#ff8a80";
    p.textContent = "Local Model Bench no pudo iniciar: " + (e && e.message ? e.message : e);
